<script type="text/plain" data-csg-file="custom_components/ceiling_scene_generator/runner.py" data-csg-size="11203">"""Async task runner: the piece that actually pushes frames to the lights.

Design goals
------------
* **Wi-Fi friendly**: one service call per *changed group of lights* every
  ``update_interval`` seconds, with the hardware ``transition`` set to roughly
  the same duration, so the fixtures interpolate smoothly between frames instead
  of receiving a packet storm.
* **Restart safe**: the runner owns a single background task; starting again
  cancels the previous one first, and ``async_stop`` is always safe to call.
* **Testable**: all the maths lives in :mod:`engine`; this module only decides
  *when* and *to whom* to send.
"""

from __future__ import annotations

import asyncio
import logging
import time
from contextlib import suppress
from dataclasses import dataclass, field
from typing import Any, Callable, Mapping

from homeassistant.core import HomeAssistant

from .const import DOMAIN
from .engine import (
    DEFAULT_MIN_BRIGHTNESS_DELTA,
    DEFAULT_MIN_COLOR_DELTA,
    DEFAULT_PALETTE,
    DEFAULT_TRANSITION,
    DEFAULT_UPDATE_INTERVAL,
    EFFECTS,
    compute_frame,
    frame_deltas,
    index_frame,
    resolve_lights,
)

_LOGGER = logging.getLogger(__name__)


@dataclass
class SceneConfig:
    """Everything the runner needs for one continuous effect."""

    name: str = "Ceiling"
    scene: dict[str, Any] = field(default_factory=dict)
    effect: str = EFFECTS[0]
    params: dict[str, Any] = field(default_factory=dict)
    palette: Any = field(default_factory=lambda: DEFAULT_PALETTE)
    update_interval: float = DEFAULT_UPDATE_INTERVAL
    transition: float = DEFAULT_TRANSITION
    min_color_delta: int = DEFAULT_MIN_COLOR_DELTA
    min_brightness_delta: int = DEFAULT_MIN_BRIGHTNESS_DELTA
    restore_on_stop: bool = False

    @classmethod
    def from_dict(cls, data: Mapping[str, Any] | None) -> "SceneConfig":
        data = dict(data or {})
        config = cls(
            name=str(data.get("name") or "Ceiling"),
            scene=dict(data.get("scene") or {}),
            effect=data.get("effect") if data.get("effect") in EFFECTS else EFFECTS[0],
            params=dict(data.get("params") or {}),
            palette=data.get("palette") or DEFAULT_PALETTE,
            update_interval=float(data.get("update_interval") or DEFAULT_UPDATE_INTERVAL),
            transition=float(data.get("transition") or DEFAULT_TRANSITION),
            min_color_delta=int(data.get("min_color_delta") or DEFAULT_MIN_COLOR_DELTA),
            min_brightness_delta=int(data.get("min_brightness_delta") or DEFAULT_MIN_BRIGHTNESS_DELTA),
            restore_on_stop=bool(data.get("restore_on_stop") or False),
        )
        if not config.scene.get("name"):
            config.scene["name"] = config.name
        return config

    def as_dict(self) -> dict[str, Any]:
        return {
            "name": self.name,
            "scene": self.scene,
            "effect": self.effect,
            "params": self.params,
            "palette": self.palette,
            "update_interval": self.update_interval,
            "transition": self.transition,
            "min_color_delta": self.min_color_delta,
            "min_brightness_delta": self.min_brightness_delta,
            "restore_on_stop": self.restore_on_stop,
        }


class SceneRunner:
    """Owns the background task that walks the effect over time."""

    def __init__(self, hass: HomeAssistant) -> None:
        self.hass = hass
        self._task: asyncio.Task[None] | None = None
        self._config = SceneConfig()
        self._last_sent: dict[str, dict[str, Any]] = {}
        self._restore: dict[str, dict[str, Any] | None] = {}
        self._listeners: list[Callable[[], None]] = []
        self._started_at: float | None = None
        self.frames = 0
        self.calls = 0
        self.last_error: str | None = None

    # ------------------------------------------------------------ book-keeping

    @property
    def active(self) -> bool:
        return self._task is not None and not self._task.done()

    @property
    def config(self) -> SceneConfig:
        return self._config

    @property
    def light_count(self) -> int:
        return len(resolve_lights(self._config.scene))

    @property
    def elapsed(self) -> float:
        return 0.0 if self._started_at is None else round(time.monotonic() - self._started_at, 1)

    def snapshot(self) -> dict[str, Any]:
        """Attributes exposed by the switch entity and returned by services."""
        return {
            "active": self.active,
            "name": self._config.name,
            "effect": self._config.effect,
            "lights": self.light_count,
            "update_interval": self._config.update_interval,
            "transition": self._config.transition,
            "frames": self.frames,
            "service_calls": self.calls,
            "elapsed": self.elapsed,
            "last_error": self.last_error,
        }

    def add_listener(self, listener: Callable[[], None]) -> Callable[[], None]:
        self._listeners.append(listener)

        def remove() -> None:
            with suppress(ValueError):
                self._listeners.remove(listener)

        return remove

    def _notify(self) -> None:
        for listener in list(self._listeners):
            try:
                listener()
            except Exception:  # pragma: no cover - listener must never break the loop
                _LOGGER.exception("Ceiling Scene Generator listener failed")

    # -------------------------------------------------------------- lifecycle

    async def async_start(self, config: SceneConfig) -> None:
        """(Re)start the generator with `config`."""
        await self.async_stop()
        self._config = config
        self._last_sent = {}
        self._restore = self._capture_states()
        self.frames = 0
        self.calls = 0
        self.last_error = None
        self._started_at = time.monotonic()

        missing = [
            light["entity_id"]
            for light in resolve_lights(config.scene)
            if self.hass.states.get(light["entity_id"]) is None
        ]
        if missing:
            _LOGGER.warning(
                "Ceiling Scene Generator: %s light(s) not found in Home Assistant: %s",
                len(missing),
                ", ".join(missing[:10]),
            )

        self._task = self.hass.async_create_background_task(
            self._async_run(), f"{DOMAIN} runner {config.name}"
        )
        self._notify()
        _LOGGER.info(
            "Ceiling Scene Generator started: %s · %s · %s lights · %.2fs interval",
            config.name,
            config.effect,
            self.light_count,
            config.update_interval,
        )

    async def async_stop(self, restore_state: bool = False) -> None:
        """Stop the generator, optionally putting the lights back as they were."""
        task, self._task = self._task, None
        if task is not None:
            task.cancel()
            with suppress(asyncio.CancelledError):
                await task
        if restore_state:
            await self._async_restore()
        self._started_at = None
        self._notify()

    async def async_resume_last(self, store) -> bool:
        """Restart the last run configuration, if one was stored."""
        last = store.last_run
        if not last or not resolve_lights(last.get("scene") or {}):
            return False
        await self.async_start(SceneConfig.from_dict(last))
        return True

    # ------------------------------------------------------------------- loop

    async def _async_run(self) -> None:
        try:
            while True:
                await self._async_push_frame()
                await asyncio.sleep(max(0.2, self._config.update_interval))
        except asyncio.CancelledError:
            raise
        except Exception as err:  # keep HA usable, surface the failure on the switch
            self.last_error = str(err)
            _LOGGER.exception("Ceiling Scene Generator runner stopped: %s", err)
        finally:
            self._notify()

    async def _async_push_frame(self) -> None:
        elapsed = self.elapsed
        frame = compute_frame(
            self._config.scene,
            self._config.effect,
            self._config.params,
            self._config.palette,
            elapsed,
        )
        self.frames += 1
        if not frame:
            return
        changed = frame_deltas(
            self._last_sent,
            frame,
            self._config.min_color_delta,
            self._config.min_brightness_delta,
        )
        if not changed:
            return

        groups: dict[tuple[int, int, int, int], list[str]] = {}
        for entry in changed:
            key = (entry["rgb"][0], entry["rgb"][1], entry["rgb"][2], int(entry["brightness_pct"]))
            groups.setdefault(key, []).append(entry["entity_id"])

        for key, entity_ids in groups.items():
            await self.hass.services.async_call(
                "light",
                "turn_on",
                {
                    "rgb_color": [key[0], key[1], key[2]],
                    "brightness_pct": key[3],
                    "transition": round(self._config.transition, 2),
                },
                target={"entity_id": entity_ids},
                blocking=False,
            )
        self.calls += len(groups)
        self._last_sent.update(index_frame(changed))

    # -------------------------------------------------------------- restoring

    def _capture_states(self) -> dict[str, dict[str, Any] | None]:
        captured: dict[str, dict[str, Any] | None] = {}
        for light in resolve_lights(self._config.scene):
            state = self.hass.states.get(light["entity_id"])
            if state is None or state.state == "off":
                captured[light["entity_id"]] = None
            else:
                captured[light["entity_id"]] = {
                    "brightness": state.attributes.get("brightness"),
                    "rgb_color": state.attributes.get("rgb_color"),
                    "hs_color": state.attributes.get("hs_color"),
                    "color_temp_kelvin": state.attributes.get("color_temp_kelvin"),
                }
        return captured

    async def _async_restore(self) -> None:
        for entity_id, saved in self._restore.items():
            if saved is None:
                await self.hass.services.async_call(
                    "light", "turn_off", {}, target={"entity_id": entity_id}, blocking=False
                )
                continue
            data: dict[str, Any] = {}
            if saved.get("rgb_color"):
                data["rgb_color"] = saved["rgb_color"]
            elif saved.get("color_temp_kelvin"):
                data["color_temp_kelvin"] = saved["color_temp_kelvin"]
            if saved.get("brightness"):
                data["brightness"] = saved["brightness"]
            await self.hass.services.async_call(
                "light",
                "turn_on",
                data,
                target={"entity_id": entity_id},
                blocking=False,
            )
        self._restore = {}

Kept in their own module so the other modules stay importable without
``voluptuous``/``homeassistant`` (useful for the pure engine test suite).
"""

from __future__ import annotations

from typing import Any

import voluptuous as vol
from homeassistant.helpers import config_validation as cv

from .const import (
    DEFAULT_FRAMES,
    DEFAULT_MIN_BRIGHTNESS_DELTA,
    DEFAULT_MIN_COLOR_DELTA,
    DEFAULT_TRANSITION,
    DEFAULT_UPDATE_INTERVAL,
    EFFECTS,
    GRID_MODES,
    PALETTES,
    PARAM_SPECS,
)

PALETTE_NAMES = sorted(PALETTES)


def cv_palette(value: Any) -> Any:
    """Palette as a preset id, a list of hex strings or a list of RGB lists."""
    if isinstance(value, str):
        if value.strip().lower() not in PALETTES:
            raise vol.Invalid(f"unknown palette '{value}', expected one of {PALETTE_NAMES}")
        return value
    if isinstance(value, (list, tuple)):
        if not value:
            raise vol.Invalid("palette must contain at least one colour")
        for item in value:
            if isinstance(item, str):
                text = item.strip().lstrip("#")
                if len(text) not in (3, 6):
                    raise vol.Invalid(f"'{item}' is not a #RGB or #RRGGBB colour")
                try:
                    int(text, 16)
                except ValueError as err:
                    raise vol.Invalid(f"'{item}' is not a valid hex colour") from err
            elif isinstance(item, (list, tuple)) and len(item) >= 3:
                if not all(isinstance(channel, (int, float)) for channel in item[:3]):
                    raise vol.Invalid("RGB colour stops must be numeric triples")
            else:
                raise vol.Invalid("palette stops must be hex strings or RGB triples")
        return list(value)
    raise vol.Invalid("palette must be a preset name or a list of colours")


def _param_range(key: str) -> Any:
    spec = PARAM_SPECS[key]
    return vol.All(vol.Coerce(float), vol.Range(min=spec["min"], max=spec["max"]))


PARAMS_SCHEMA = vol.Schema(
    {vol.Optional(key): _param_range(key) for key in PARAM_SPECS},
    extra=vol.PREVENT_EXTRA,
)

LIGHT_SCHEMA = vol.Schema(
    {
        vol.Required("entity_id"): cv.entity_id,
        vol.Optional("x", default=0): vol.Coerce(float),
        vol.Optional("y", default=0): vol.Coerce(float),
        vol.Optional("row", default=0): vol.Coerce(int),
        vol.Optional("col", default=0): vol.Coerce(int),
        vol.Optional("name"): cv.string,
    },
    extra=vol.ALLOW_EXTRA,
)

ROOM_SCHEMA = vol.Schema(
    {
        vol.Optional("width", default=6.0): vol.All(vol.Coerce(float), vol.Range(min=0.1, max=100)),
        vol.Optional("height", default=4.5): vol.All(vol.Coerce(float), vol.Range(min=0.1, max=100)),
        vol.Optional("padding", default=0.5): vol.All(vol.Coerce(float), vol.Range(min=0, max=50)),
    },
    extra=vol.ALLOW_EXTRA,
)

GRID_SCHEMA = vol.Schema(
    {
        vol.Optional("mode", default="grid"): vol.In(GRID_MODES),
        vol.Optional("rows", default=3): vol.All(vol.Coerce(int), vol.Range(min=1, max=32)),
        vol.Optional("cols", default=4): vol.All(vol.Coerce(int), vol.Range(min=1, max=32)),
    },
    extra=vol.ALLOW_EXTRA,
)

SCENE_SCHEMA = vol.Schema(
    {
        vol.Optional("name", default="Ceiling"): cv.string,
        vol.Optional("room"): ROOM_SCHEMA,
        vol.Optional("grid"): GRID_SCHEMA,
        vol.Optional("lights", default=list): vol.All(cv.ensure_list, [LIGHT_SCHEMA], vol.Length(min=1)),
    },
    extra=vol.ALLOW_EXTRA,
)

START_SCHEMA = vol.Schema(
    {
        vol.Optional("name"): cv.string,
        vol.Optional("scene"): SCENE_SCHEMA,
        vol.Optional("effect"): vol.In(EFFECTS),
        vol.Optional("params"): PARAMS_SCHEMA,
        vol.Optional("palette"): cv_palette,
        vol.Optional("update_interval", default=DEFAULT_UPDATE_INTERVAL): vol.All(
            vol.Coerce(float), vol.Range(min=0.2, max=60)
        ),
        vol.Optional("transition", default=DEFAULT_TRANSITION): vol.All(
            vol.Coerce(float), vol.Range(min=0, max=60)
        ),
        vol.Optional("min_color_delta", default=DEFAULT_MIN_COLOR_DELTA): vol.All(
            vol.Coerce(int), vol.Range(min=0, max=255)
        ),
        vol.Optional("min_brightness_delta", default=DEFAULT_MIN_BRIGHTNESS_DELTA): vol.All(
            vol.Coerce(int), vol.Range(min=0, max=100)
        ),
        vol.Optional("restore_on_stop", default=False): cv.boolean,
        vol.Optional("save", default=False): cv.boolean,
    },
    extra=vol.PREVENT_EXTRA,
)

STOP_SCHEMA = vol.Schema(
    {
        vol.Optional("restore_state", default=False): cv.boolean,
        vol.Optional("clear_last_run", default=False): cv.boolean,
    },
    extra=vol.PREVENT_EXTRA,
)

SAVE_AS_SCRIPT_SCHEMA = vol.Schema(
    {
        vol.Optional("name"): cv.string,
        vol.Optional("scene"): SCENE_SCHEMA,
        vol.Optional("effect"): vol.In(EFFECTS),
        vol.Optional("params"): PARAMS_SCHEMA,
        vol.Optional("palette"): cv_palette,
        vol.Optional("frames", default=DEFAULT_FRAMES): vol.All(vol.Coerce(int), vol.Range(min=2, max=120)),
        vol.Optional("transition"): vol.All(vol.Coerce(float), vol.Range(min=0, max=60)),
        vol.Optional("script_name"): cv.string,
        vol.Optional("alias"): cv.string,
        vol.Optional("write_file", default=False): cv.boolean,
        vol.Optional("filename"): cv.string,
    },
    extra=vol.PREVENT_EXTRA,
)

SAVE_SCENE_SCHEMA = vol.Schema(
    {
        vol.Required("name"): cv.string,
        vol.Optional("scene"): SCENE_SCHEMA,
        vol.Optional("effect"): vol.In(EFFECTS),
        vol.Optional("params"): PARAMS_SCHEMA,
        vol.Optional("palette"): cv_palette,
        vol.Optional("update_interval"): vol.All(vol.Coerce(float), vol.Range(min=0.2, max=60)),
        vol.Optional("transition"): vol.All(vol.Coerce(float), vol.Range(min=0, max=60)),
    },
    extra=vol.PREVENT_EXTRA,
)

DELETE_SCENE_SCHEMA = vol.Schema(
    {vol.Required("name"): cv.string},
    extra=vol.PREVENT_EXTRA,
)

LIST_SCENES_SCHEMA = vol.Schema(
    {},
    extra=vol.PREVENT_EXTRA,
)

<script type="text/plain" data-csg-file="custom_components/ceiling_scene_generator/script_compiler.py" data-csg-size="11606">"""Compile a Ceiling Scene into native Home Assistant YAML.

Two outputs are produced for the user:

``compile_script``
    A fully static ``scripts.yaml`` entry: the wave is sampled into N frames per
    cycle and replayed with ``light.turn_on`` + ``transition``, so the lights keep
    animating even if the integration's background task is not running (perfect
    for a dashboard button, an automation, or a wall tablet).

``compile_service_call``
    The YAML for the *live* generator (``ceiling_scene_generator.start``), i.e.
    the continuous, rate limited version driven by the integration.

The YAML is emitted by a tiny hand written writer: the output is deterministic,
stable across runs and needs no third party dependency, which keeps the
integration's test suite runnable on a bare Python install.
"""

from __future__ import annotations

import re
from typing import Any, Iterable, Mapping, Sequence

from .engine import (
    DEFAULT_FRAMES,
    DEFAULT_TRANSITION,
    DEFAULT_UPDATE_INTERVAL,
    DEFAULT_PARAMS,
    EFFECT_EQUATIONS,
    EFFECT_LABELS,
    EFFECTS,
    PALETTES,
    cycle_period,
    compute_frame,
    normalize_palette,
    resolve_lights,
    resolve_params,
    room_bounds,
)

__all__ = [
    "slugify",
    "group_frame",
    "build_frame_plan",
    "compile_script",
    "compile_service_call",
    "compile_card_yaml",
]


# --------------------------------------------------------------------------- #
# Small YAML writer
# --------------------------------------------------------------------------- #

_SIMPLE_SCALAR = re.compile(r"^[A-Za-z0-9_][A-Za-z0-9_\-./:%]*$")
_RESERVED = {"true", "false", "null", "yes", "no", "on", "off", "none", "~"}


def yaml_scalar(value: Any) -> str:
    """Render a scalar in a way PyYAML would read back identically."""
    if value is None:
        return "null"
    if isinstance(value, bool):
        return "true" if value else "false"
    if isinstance(value, (int, float)):
        if isinstance(value, float) and float(value).is_integer():
            return str(int(value))
        return repr(value) if isinstance(value, float) else str(value)
    text = str(value)
    if not text:
        return "''"
    if _SIMPLE_SCALAR.match(text) and text.lower() not in _RESERVED:
        return text
    return "'" + text.replace("'", "''") + "'"


def _emit(node: Any, indent: int, lines: list[str], key_prefix: str = "") -> None:
    pad = " " * indent
    if isinstance(node, Mapping):
        for key, value in node.items():
            rendered_key = yaml_scalar(key)
            if isinstance(value, Mapping):
                if not value:
                    lines.append(f"{pad}{rendered_key}: {{}}")
                else:
                    lines.append(f"{pad}{rendered_key}:")
                    _emit(value, indent + 2, lines)
            elif isinstance(value, (list, tuple)):
                if not value:
                    lines.append(f"{pad}{rendered_key}: []")
                    continue
                lines.append(f"{pad}{rendered_key}:")
                _emit(list(value), indent + 2, lines)
            else:
                lines.append(f"{pad}{rendered_key}: {yaml_scalar(value)}")
        return
    if isinstance(node, (list, tuple)):
        for item in node:
            if isinstance(item, Mapping):
                block: list[str] = []
                _emit(item, indent + 2, block)
                lines.append(f"{pad}- {block[0].strip()}")
                lines.extend(block[1:])
            elif isinstance(item, (list, tuple)):
                lines.append(f"{pad}-")
                _emit(list(item), indent + 2, lines)
            else:
                lines.append(f"{pad}- {yaml_scalar(item)}")
        return
    lines.append(f"{pad}{yaml_scalar(node)}")


def yaml_dump(document: Mapping[str, Any], header: Sequence[str] = ()) -> str:
    lines: list[str] = [f"# {line}" if line else "#" for line in header]
    if lines:
        lines.append("")
    _emit(document, 0, lines)
    return "\n".join(lines) + "\n"


# --------------------------------------------------------------------------- #
# Frames
# --------------------------------------------------------------------------- #

def group_frame(frame: Iterable[Mapping[str, Any]]) -> list[dict[str, Any]]:
    """Collapse a frame into one service call per distinct (colour, brightness).

    Symmetric effects (checkerboard, bouncing jumps, sharp bands) put many lights
    on exactly the same colour: grouping shrinks the generated script a lot and
    the number of packets Home Assistant has to send.
    """
    groups: dict[tuple[int, int, int, int], dict[str, Any]] = {}
    for entry in frame:
        key = (entry["rgb"][0], entry["rgb"][1], entry["rgb"][2], int(entry["brightness_pct"]))
        group = groups.get(key)
        if group is None:
            groups[key] = {
                "entity_ids": [entry["entity_id"]],
                "rgb_color": list(entry["rgb"]),
                "brightness_pct": int(entry["brightness_pct"]),
            }
        else:
            group["entity_ids"].append(entry["entity_id"])
    return list(groups.values())


def build_frame_plan(
    scene: Mapping[str, Any] | None,
    effect: str = "linear_wave",
    params: Mapping[str, Any] | None = None,
    palette: Any = None,
    frames: int = DEFAULT_FRAMES,
) -> tuple[list[list[dict[str, Any]]], float]:
    """Sample one full cycle into `frames` grouped frames.

    Returns the frames and the per-frame delay in seconds.  Frame `k` is rendered
    at ``t = k / (speed * frames)`` so that the plan covers exactly one period.
    """
    frames = max(2, min(120, int(frames or DEFAULT_FRAMES)))
    period = cycle_period(params)
    # Sample at the delay that is actually written into the YAML, so the compiled
    # script replays the exact frames the engine produced.
    step = round(period / frames, 3)
    plan = []
    for index in range(frames):
        frame = compute_frame(scene, effect, params, palette, index * step)
        plan.append(group_frame(frame))
    return plan, step


# --------------------------------------------------------------------------- #
# YAML outputs
# --------------------------------------------------------------------------- #

def slugify(text: str) -> str:
    slug = re.sub(r"[^a-z0-9]+", "_", str(text).strip().lower()).strip("_")
    return slug or "ceiling_scene"


def compile_script(
    scene: Mapping[str, Any] | None,
    effect: str = "linear_wave",
    params: Mapping[str, Any] | None = None,
    palette: Any = None,
    frames: int = DEFAULT_FRAMES,
    script_name: str | None = None,
    alias: str | None = None,
    transition: float | None = None,
    icon: str = "mdi:ceiling-light-multiple",
) -> dict[str, Any]:
    """Return the ``scripts.yaml`` entry for a static, self-contained wave."""
    effect = effect if effect in EFFECTS else EFFECTS[0]
    resolved = resolve_params(params)
    scene = scene or {}
    lights = resolve_lights(scene)
    scene_name = str(scene.get("name") or "Ceiling")
    script_id = slugify(script_name or f"{scene_name}_{EFFECT_LABELS[effect]}")
    plan, step = build_frame_plan(scene, effect, resolved, palette, frames)
    fade = float(transition) if transition is not None else round(step * 0.95, 2)

    repeats = []
    for groups in plan:
        calls = [
            {
                "service": "light.turn_on",
                "target": {"entity_id": list(group["entity_ids"])},
                "data": {
                    "rgb_color": list(group["rgb_color"]),
                    "brightness_pct": group["brightness_pct"],
                    "transition": round(fade, 2),
                },
            }
            for group in groups
        ]
        repeats.append(
            {
                "parallel": calls,
                "delay": {"seconds": round(step, 3)},
            }
        )

    width, height = room_bounds(scene)
    header = [
        "Ceiling Scene Generator - compiled script",
        f"scene: {scene_name} ({width:g} x {height:g} m, {len(lights)} lights)",
        f"effect: {effect} - {EFFECT_LABELS[effect]}",
        f"equation: {EFFECT_EQUATIONS[effect]}",
        f"cycle: {round(cycle_period(resolved), 3)} s over {len(plan)} frames "
        f"(delay {round(step, 3)} s, transition {round(fade, 2)} s)",
        "regenerate: service ceiling_scene_generator.save_as_script",
        "",
        "Paste into scripts.yaml (or Settings > Automations & scenes > Scripts > Edit in YAML).",
    ]

    document = {
        script_id: {
            "alias": alias or f"Ceiling Scene - {scene_name} - {EFFECT_LABELS[effect]}",
            "icon": icon,
            "mode": "restart",
            "sequence": [{"repeat": {"count": len(plan), "sequence": repeats}}],
        }
    }
    # The empty line in the header renders as a bare '#' comment.
    return {
        "script_id": script_id,
        "yaml": yaml_dump(document, header),
        "frames": len(plan),
        "delay": round(step, 3),
        "transition": round(fade, 2),
        "cycle": round(cycle_period(resolved), 3),
        "lights": len(lights),
        "service_calls": sum(len(groups) for groups in plan),
    }


def compile_service_call(
    scene: Mapping[str, Any] | None,
    effect: str = "linear_wave",
    params: Mapping[str, Any] | None = None,
    palette: Any = None,
    update_interval: float = DEFAULT_UPDATE_INTERVAL,
    transition: float = DEFAULT_TRANSITION,
) -> str:
    """YAML front end for the live generator service."""
    effect = effect if effect in EFFECTS else EFFECTS[0]
    resolved = resolve_params(params)
    if isinstance(palette, str) and palette.strip().lower() in PALETTES:
        palette_value: Any = palette.strip().lower()
    else:
        palette_value = palette_hex_list(palette)
    entry: dict[str, Any] = {
        "service": "ceiling_scene_generator.start",
        "data": {
            "name": str((scene or {}).get("name") or "Ceiling"),
            "effect": effect,
            "params": {key: (int(value) if float(value).is_integer() else value) for key, value in sorted(resolved.items())},
            "palette": palette_value,
            "update_interval": update_interval,
            "transition": transition,
            "scene": dict(scene or {}),
        },
    }
    line = "# live generator - the integration pushes rate limited updates"
    return line + "\n" + yaml_dump(entry)


def compile_card_yaml(
    scene: Mapping[str, Any] | None,
    effect: str = "linear_wave",
    palette: Any = None,
    title: str | None = None,
) -> str:
    """Lovelace card config snippet for the compiled scene."""
    stops = normalize_palette(palette)
    config = {
        "type": "custom:ceiling-scene-card",
        "title": title or f"Ceiling Scene - {str((scene or {}).get('name') or 'Ceiling')}",
        "effect": effect if effect in EFFECTS else EFFECTS[0],
        "palette": [c if isinstance(c, str) else "#%02X%02X%02X" % tuple(c) for c in stops],
        "scene": dict(scene or {}),
    }
    return yaml_dump(config, ["Lovelace card (paste as a manual card)"])


def palette_hex_list(palette: Any) -> list[str]:
    """Palette as ``#RRGGBB`` strings (handy for the frontend and the services)."""
    return ["#%02X%02X%02X" % color for color in normalize_palette(palette)]


def palette_presets() -> dict[str, list[str]]:
    """The eight curated palettes, as hex lists."""
    return {key: list(entry["colors"]) for key, entry in PALETTES.items()}


def default_params() -> dict[str, float]:
    return dict(DEFAULT_PARAMS)

<script type="text/plain" data-csg-file="custom_components/ceiling_scene_generator/storage.py" data-csg-size="3372">"""Home Assistant Storage persistence for ceiling scenes.

Scenes (room + light layout + effect + parameters + palette) and the last run
configuration are kept in ``.storage/ceiling_scene_generator.store`` so the
generator survives a Home Assistant restart and can auto-resume.
"""

from __future__ import annotations

from typing import Any, Mapping

from homeassistant.core import HomeAssistant
from homeassistant.helpers.storage import Store

from .const import (
    SAVED_LAST_RUN,
    SAVED_SCENES,
    STORAGE_KEY,
    STORAGE_MINOR_VERSION,
    STORAGE_VERSION,
)


class SceneStore:
    """Thin wrapper around ``homeassistant.helpers.storage.Store``."""

    def __init__(self, hass: HomeAssistant) -> None:
        self._store: Store = Store(
            hass,
            STORAGE_VERSION,
            STORAGE_KEY,
            minor_version=STORAGE_MINOR_VERSION,
        )
        self._scenes: dict[str, dict[str, Any]] = {}
        self._last_run: dict[str, Any] | None = None

    async def async_load(self) -> None:
        data = await self._store.async_load() or {}
        scenes = data.get(SAVED_SCENES) or {}
        self._scenes = {str(key): dict(value) for key, value in scenes.items() if isinstance(value, Mapping)}
        last_run = data.get(SAVED_LAST_RUN)
        self._last_run = dict(last_run) if isinstance(last_run, Mapping) else None

    def _snapshot(self) -> dict[str, Any]:
        return {SAVED_SCENES: self._scenes, SAVED_LAST_RUN: self._last_run}

    async def _async_write(self) -> None:
        await self._store.async_save(self._snapshot())

    # ---------------------------------------------------------------- scenes

    @property
    def scenes(self) -> dict[str, dict[str, Any]]:
        return dict(self._scenes)

    def get(self, name: str) -> dict[str, Any] | None:
        if not name:
            return None
        record = self._scenes.get(name)
        if record is not None:
            return dict(record)
        lowered = str(name).strip().lower()
        for key, value in self._scenes.items():
            if key.strip().lower() == lowered:
                return dict(value)
        return None

    async def async_save_scene(self, name: str, record: Mapping[str, Any]) -> str:
        key = str(name).strip() or "Ceiling"
        self._scenes[key] = dict(record)
        await self._async_write()
        return key

    async def async_delete_scene(self, name: str) -> bool:
        key = str(name).strip()
        removed = self._scenes.pop(key, None)
        if removed is None:
            for existing in list(self._scenes):
                if existing.strip().lower() == key.lower():
                    removed = self._scenes.pop(existing)
                    break
        if removed is None:
            return False
        await self._async_write()
        return True

    # -------------------------------------------------------------- last run

    @property
    def last_run(self) -> dict[str, Any] | None:
        return dict(self._last_run) if self._last_run else None

    async def async_set_last_run(self, record: Mapping[str, Any]) -> None:
        self._last_run = dict(record)
        await self._async_write()

    async def async_clear_last_run(self) -> None:
        if self._last_run is None:
            return
        self._last_run = None
        await self._async_write()

<script type="text/plain" data-csg-file="custom_components/ceiling_scene_generator/switch.py" data-csg-size="3165">"""Switch platform: a single on/off handle for the running generator.

``switch.ceiling_scene`` is on while the async runner is pushing frames. It is
also the entity the Lovelace card watches for its status chip, which is why
``extra_state_attributes`` carries the ``ceiling_scene_generator`` marker.
"""

from __future__ import annotations

from typing import Any

from homeassistant.components.switch import SwitchEntity
from homeassistant.config_entries import ConfigEntry
from homeassistant.core import HomeAssistant, callback
from homeassistant.exceptions import HomeAssistantError
from homeassistant.helpers.entity import DeviceInfo
from homeassistant.helpers.entity_platform import AddEntitiesCallback

from .const import DOMAIN, MANUFACTURER, NAME, SWITCH_DEFAULT_NAME, SWITCH_UNIQUE_ID
from .runner import SceneRunner, SceneConfig
from .storage import SceneStore


async def async_setup_entry(
    hass: HomeAssistant,
    entry: ConfigEntry,
    async_add_entities: AddEntitiesCallback,
) -> None:
    data = hass.data[DOMAIN][entry.entry_id]
    async_add_entities([CeilingSceneSwitch(data["runner"], data["store"])])


class CeilingSceneSwitch(SwitchEntity):
    """On/off handle for the ceiling scene generator."""

    _attr_should_poll = False
    _attr_icon = "mdi:ceiling-light-multiple"
    _attr_name = SWITCH_DEFAULT_NAME
    _attr_unique_id = SWITCH_UNIQUE_ID

    def __init__(self, runner: SceneRunner, store: SceneStore) -> None:
        self._runner = runner
        self._store = store

    # ------------------------------------------------------------ properties

    @property
    def is_on(self) -> bool:
        return self._runner.active

    @property
    def device_info(self) -> DeviceInfo:
        return DeviceInfo(
            identifiers={(DOMAIN, SWITCH_UNIQUE_ID)},
            name=NAME,
            manufacturer=MANUFACTURER,
            model="Spatial ceiling effect generator",
            sw_version=self._runner.config.effect,
        )

    @property
    def extra_state_attributes(self) -> dict[str, Any]:
        attributes: dict[str, Any] = {"ceiling_scene_generator": True}
        attributes.update(self._runner.snapshot())
        attributes["scenes"] = sorted(self._store.scenes)
        return attributes

    # ---------------------------------------------------------------- control

    async def async_turn_on(self, **kwargs: Any) -> None:
        record = self._store.last_run
        if not record:
            raise HomeAssistantError(
                "No ceiling scene to start yet. Call ceiling_scene_generator.start "
                "(or use the Lovelace card) first."
            )
        await self._runner.async_start(SceneConfig.from_dict(record))

    async def async_turn_off(self, **kwargs: Any) -> None:
        await self._runner.async_stop(self._runner.config.restore_on_stop)

    # -------------------------------------------------------------- lifecycle

    async def async_added_to_hass(self) -> None:
        self.async_on_remove(self._runner.add_listener(self._handle_runner_update))

    @callback
    def _handle_runner_update(self) -> None:
        self.async_write_ha_state()

 *
 * Ceiling Scene Generator - Lovelace card and the shared spatial effect engine.
 *
 * The engine below (`globalThis.CeilingSceneEngine`) is a line by line mirror of
 * `custom_components/ceiling_scene_generator/engine.py`; `tests/test_js_parity.py`
 * runs both over identical fixtures, so the canvas preview is provably what the
 * physical lights will do.

 * Loading this file in a non browser context (Node, for the parity test) is
 * supported: the engine is exported and the custom element is only defined when
 * `customElements` exists.
 *
 * Install as a Lovelace resource: /ceiling_scene_generator/ceiling-scene-card.js
 */
(function (root) {

  var TAU = Math.PI * 2;

  /* ====================================================================== *
   *  Effect engine (mirror of engine.py)                                   *
   * ====================================================================== */

  var ENGINE = (function () {
    var VERSION = '1.0.0';

    var EFFECTS = [
      'linear_wave', 'radial_pulse', 'checkerboard_breathe', 'diagonal_runs',
      'perimeter_chase', 'bouncing_jumps', 'galaxy_stars', 'spiral_vortex',
      'crossfire_waves', 'center_burst'

    var EFFECT_LABELS = {
      linear_wave: 'Linear Wave',
      radial_pulse: 'Radial Pulse',
      checkerboard_breathe: 'Checkerboard Breathe',
      diagonal_runs: 'Diagonal Runs',
      perimeter_chase: 'Perimeter Chase',
      bouncing_jumps: 'Bouncing Jumps',
      galaxy_stars: 'Galaxy Stars',
      spiral_vortex: 'Spiral Vortex',
      crossfire_waves: 'Crossfire Waves',
      center_burst: 'Center Burst'
    };

    var EFFECT_EQUATIONS = {
      linear_wave: 'u = nx*cos(a) + ny*sin(a);  v = 0.5 + 0.5*sin(2π(u/λ - s*t))',
      radial_pulse: 'r = hypot(xn-cx, yn-cy);  v = 0.5 + 0.5*sin(2π(r/λ - s*t))',
      checkerboard_breathe: 'c = (row+col) mod 2;  v = frac(s*t + c/2);  i = 0.5+0.5*sin(2π(2*s*t + c/2))',
      diagonal_runs: 'u = (nx+ny)/2;  p = frac(u/λ - s*t);  v = exp(-(p-0.5)² / (2σ²))',
      perimeter_chase: 'S = arc length of projection onto room boundary;  v = 0.5 + 0.5*sin(2π(S/λ - s*t))',
      bouncing_jumps: 'p = frac(u/λ + s*t);  tri = 1-|2p-1|;  v = floor(tri*steps)/(steps-1)',
      galaxy_stars: 'h = hash01(index);  v = frac(h₁ + 0.1*s*t);  i = h₃ + (0.5+0.5*sin(2π(s*rate*t + h₂)))³ (1-h₃)',
      spiral_vortex: 'ang = atan2(yn-cy, xn-cx)/2π;  v = 0.5 + 0.5*sin(2π(ang*arms - r/λ + s*t))',
      crossfire_waves: 'wx = 0.5+0.5*sin(2π(nx/λ - s*t));  wy = 0.5+0.5*sin(2π(ny/λ + s*t));  v = (wx+wy)/2',
      center_burst: 'r₀ = frac(s*t)*0.75;  v = exp(-(r-r₀)² / (2σ²))'
    };

    var PALETTES = {
      sunset: { name: 'Sunset', colors: ['#FF6B35', '#F7931E', '#FDC830', '#D62828', '#6A0572'] },
      ocean: { name: 'Ocean', colors: ['#012E4A', '#036280', '#378BA4', '#81BECE', '#E2F1E7'] },
      cyberpunk: { name: 'Cyberpunk', colors: ['#FF2A6D', '#05D9E8', '#01012B', '#D1F7FF', '#7700FF'] },
      rainbow: { name: 'Rainbow', colors: ['#FF0000', '#FFA500', '#FFFF00', '#00C853', '#0091EA', '#6A1B9A'] },
      forest: { name: 'Forest', colors: ['#0B3D0B', '#1E7A34', '#62A744', '#C7E59C', '#2F5D3A'] },
      aurora: { name: 'Aurora', colors: ['#00C2A8', '#3BD4AE', '#7B61FF', '#1B1464', '#00E5FF'] },
      ember: { name: 'Ember', colors: ['#1A0000', '#5C1010', '#C1292E', '#FF7A18', '#FFD166'] },
      ice: { name: 'Ice', colors: ['#061B33', '#0E4C92', '#3FA9F5', '#A8E6FF', '#FFFFFF'] }
