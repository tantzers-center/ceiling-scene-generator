<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceiling Scene Studio - Ceiling Scene Generator</title>
<style>
  :root{
    --bg:#0F172A; --panel:#1E293B; --panel-2:#0B1120; --accent:#38BDF8;
    --line:#64748B; --text:#E2E8F0; --muted:#94A3B8; --danger:#FCA5A5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text); font-size:13px; line-height:1.45;
    font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    font-variant-numeric:tabular-nums}
  .app{max-width:1500px;margin:0 auto;padding:16px 18px 40px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
  .brand p{margin:2px 0 0}
  .sub{font-size:11.5px;color:var(--muted)}
  .topActions{margin-left:auto;display:flex;align-items:center;gap:9px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;
    border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .grid{display:grid;grid-template-columns:minmax(360px,1fr) minmax(380px,520px);gap:16px;align-items:start}
  @media (max-width:1000px){.grid{grid-template-columns:1fr}}
  .stage{position:sticky;top:16px}
  .stageHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .hint{font-size:11px;color:var(--muted);line-height:1.5}
  canvas{width:100%;display:block;border-radius:12px;background:var(--panel-2);
    border:1px solid var(--line);touch-action:none;cursor:crosshair}
  .hud{margin-top:8px;font-size:11.5px;color:var(--muted)}
  .side{min-width:0}
  .tabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
  .tab{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--muted);cursor:pointer}
  .tab.active{background:var(--panel);color:var(--text);border-color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:10px}
  .panel h4{margin:0 0 9px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .row:last-child{margin-bottom:0}
  .field{display:flex;flex-direction:column;gap:3px;min-width:74px}
  .field label{font-size:10px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
  input,select{font:inherit;font-size:12px;color:var(--text);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0}
  input[type=range]{padding:0;background:transparent;border:0;width:100%;accent-color:var(--accent)}
  input[type=color]{width:38px;height:28px;padding:0;border-radius:7px;background:transparent}
  button{font:inherit;font-size:12px;cursor:pointer;color:var(--text);background:var(--panel-2);
    border:1px solid var(--line);border-radius:9px;padding:6px 11px;
    transition:border-color .15s,background .15s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06121F;font-weight:700}
  button.danger{border-color:#7F1D1D;color:var(--danger)}
  button.small{padding:4px 8px;font-size:11px}
  .range{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .range .name{font-size:11px;color:var(--muted);width:130px;flex:0 0 auto}
  .range .val{font-size:11px;width:78px;text-align:right;flex:0 0 auto}
  .grid-effects{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:7px}
  .effect{text-align:left;padding:8px 9px;border-radius:10px;background:var(--panel-2);
    border:1px solid var(--line)}
  .effect.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .effect b{display:block;font-size:12px;font-weight:600;margin-bottom:3px}
  .effect em{font-style:normal;font-size:9.5px;color:var(--muted);line-height:1.35;
    display:block;word-break:break-word}
  .swatches{display:flex;gap:7px;flex-wrap:wrap}
  .swatch{width:74px;padding:5px;border-radius:9px;background:var(--panel-2);
    border:1px solid var(--line);cursor:pointer}
  .swatch.active{border-color:var(--accent)}
  .swatch .bar{height:16px;border-radius:6px;margin-bottom:4px}
  .swatch span{font-size:10px;color:var(--muted)}
  .stop{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .stop input.hex{width:96px;text-transform:uppercase}
  .ramp{width:100%;height:26px;border-radius:8px;border:1px solid var(--line);display:block;
    background:var(--panel-2)}
  pre{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;
    max-height:270px;overflow:auto;font-size:11px;white-space:pre;margin:0}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer}
  .chk input{width:14px;height:14px;accent-color:var(--accent)}
  .filelist{display:flex;flex-direction:column;gap:6px}
  .filerow{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;
    background:var(--panel-2);border:1px solid var(--line)}
  .filemeta{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px}
  .fpath{font-size:11px;word-break:break-all;color:var(--text)}
  .fsize{font-size:10px;color:var(--muted)}
  .fileactions{display:flex;gap:6px;flex:0 0 auto}
  ol.steps{margin:0;padding-left:20px;font-size:12px;color:var(--text)}
  ol.steps li{margin-bottom:8px}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .status{font-size:11.5px;color:var(--muted);margin-top:8px;min-height:15px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:7px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Ceiling Scene Studio</h1>
      <p class="sub mono" id="sceneSummary">loading...</p>
    </div>
    <div class="topActions">
      <span class="chip" id="engineChip"><span class="dot"></span><span>engine</span></span>
      <button id="playBtn">Pause</button>
    </div>
  </header>
  <main class="grid">
    <section class="stage">
      <div class="stageHead">
        <span class="hint mono">drag a fixture to move it &middot; shift = fine adjust &middot; Add light then click empty space</span>
      </div>
      <canvas id="canvas" height="320"></canvas>
      <div class="hud mono" id="hud">live preview</div>
      <div class="legend">
        <span class="mono">10 effects</span>
        <span class="mono">8 palettes</span>
        <span class="mono">offline &middot; file:// ready</span>
      </div>
    </section>
    <aside class="side">
      <nav class="tabs" id="tabs"></nav>
      <div id="panel"></div>
      <div class="status" id="status"></div>
    </aside>
  </main>
</div>

<script id="csg-studio">
var root = (typeof globalThis !== "undefined") ? globalThis : this;
/* ==== BEGIN ENGINE (generated by tools/build_studio.py from www/ceiling-scene-card.js - do not edit) ==== */
  var ENGINE = (function () {
    var VERSION = '1.0.0';

    var EFFECTS = [
      'linear_wave', 'radial_pulse', 'checkerboard_breathe', 'diagonal_runs',
      'perimeter_chase', 'bouncing_jumps', 'galaxy_stars', 'spiral_vortex',
      'crossfire_waves', 'center_burst'
    ];

    var EFFECT_LABELS = {
      linear_wave: 'Linear Wave',
      radial_pulse: 'Radial Pulse',
      checkerboard_breathe: 'Checkerboard Breathe',
      diagonal_runs: 'Diagonal Runs',
      perimeter_chase: 'Perimeter Chase',
      bouncing_jumps: 'Bouncing Jumps',
      galaxy_stars: 'Galaxy Stars',
      spiral_vortex: 'Spiral Vortex',
      crossfire_waves: 'Crossfire Waves',
      center_burst: 'Center Burst'
    };

    var EFFECT_EQUATIONS = {
      linear_wave: 'u = nx*cos(a) + ny*sin(a);  v = 0.5 + 0.5*sin(2π(u/λ - s*t))',
      radial_pulse: 'r = hypot(xn-cx, yn-cy);  v = 0.5 + 0.5*sin(2π(r/λ - s*t))',
      checkerboard_breathe: 'c = (row+col) mod 2;  v = frac(s*t + c/2);  i = 0.5+0.5*sin(2π(2*s*t + c/2))',
      diagonal_runs: 'u = (nx+ny)/2;  p = frac(u/λ - s*t);  v = exp(-(p-0.5)² / (2σ²))',
      perimeter_chase: 'S = arc length of projection onto room boundary;  v = 0.5 + 0.5*sin(2π(S/λ - s*t))',
      bouncing_jumps: 'p = frac(u/λ + s*t);  tri = 1-|2p-1|;  v = floor(tri*steps)/(steps-1)',
      galaxy_stars: 'h = hash01(index);  v = frac(h₁ + 0.1*s*t);  i = h₃ + (0.5+0.5*sin(2π(s*rate*t + h₂)))³ (1-h₃)',
      spiral_vortex: 'ang = atan2(yn-cy, xn-cx)/2π;  v = 0.5 + 0.5*sin(2π(ang*arms - r/λ + s*t))',
      crossfire_waves: 'wx = 0.5+0.5*sin(2π(nx/λ - s*t));  wy = 0.5+0.5*sin(2π(ny/λ + s*t));  v = (wx+wy)/2',
      center_burst: 'r₀ = frac(s*t)*0.75;  v = exp(-(r-r₀)² / (2σ²))'
    };

    var PALETTES = {
      sunset: { name: 'Sunset', colors: ['#FF6B35', '#F7931E', '#FDC830', '#D62828', '#6A0572'] },
      ocean: { name: 'Ocean', colors: ['#012E4A', '#036280', '#378BA4', '#81BECE', '#E2F1E7'] },
      cyberpunk: { name: 'Cyberpunk', colors: ['#FF2A6D', '#05D9E8', '#01012B', '#D1F7FF', '#7700FF'] },
      rainbow: { name: 'Rainbow', colors: ['#FF0000', '#FFA500', '#FFFF00', '#00C853', '#0091EA', '#6A1B9A'] },
      forest: { name: 'Forest', colors: ['#0B3D0B', '#1E7A34', '#62A744', '#C7E59C', '#2F5D3A'] },
      aurora: { name: 'Aurora', colors: ['#00C2A8', '#3BD4AE', '#7B61FF', '#1B1464', '#00E5FF'] },
      ember: { name: 'Ember', colors: ['#1A0000', '#5C1010', '#C1292E', '#FF7A18', '#FFD166'] },
      ice: { name: 'Ice', colors: ['#061B33', '#0E4C92', '#3FA9F5', '#A8E6FF', '#FFFFFF'] }
    };

    var DEFAULT_PALETTE = 'sunset';

    var DEFAULT_PARAMS = {
      speed: 0.12, angle: 0, wavelength: 0.35, center_x: 0.5, center_y: 0.5,
      brightness_min: 15, brightness_max: 100, amplitude: 1.0, arms: 3,
      steps: 6, sigma: 0.18, phase: 0
    };

    var PARAM_SPECS = {
      speed: { min: 0.01, max: 1.0, step: 0.01, label: 'Speed', unit: 'cyc/s', group: 'motion', decimals: 2 },
      angle: { min: 0, max: 360, step: 1, label: 'Angle', unit: 'deg', group: 'motion', decimals: 0 },
      wavelength: { min: 0.05, max: 1.5, step: 0.01, label: 'Wavelength', unit: 'room', group: 'motion', decimals: 2 },
      phase: { min: 0, max: 1, step: 0.01, label: 'Phase', unit: 'cyc', group: 'motion', decimals: 2 },
      center_x: { min: 0, max: 1, step: 0.01, label: 'Pulse Center X', unit: '', group: 'geometry', decimals: 2 },
      center_y: { min: 0, max: 1, step: 0.01, label: 'Pulse Center Y', unit: '', group: 'geometry', decimals: 2 },
      arms: { min: 1, max: 8, step: 1, label: 'Spiral Arms', unit: '', group: 'geometry', decimals: 0 },
      sigma: { min: 0.02, max: 0.5, step: 0.01, label: 'Band Width', unit: '', group: 'geometry', decimals: 2 },
      steps: { min: 2, max: 12, step: 1, label: 'Jump Steps', unit: '', group: 'geometry', decimals: 0 },
      brightness_min: { min: 1, max: 100, step: 1, label: 'Brightness Floor', unit: '%', group: 'light', decimals: 0 },
      brightness_max: { min: 1, max: 100, step: 1, label: 'Brightness Ceiling', unit: '%', group: 'light', decimals: 0 },
      amplitude: { min: 0, max: 1, step: 0.05, label: 'Brightness Amplitude', unit: '', group: 'light', decimals: 2 }
    };

    var EFFECT_PARAMS = {
      linear_wave: ['speed', 'angle', 'wavelength', 'phase'],
      radial_pulse: ['speed', 'wavelength', 'center_x', 'center_y', 'phase'],
      checkerboard_breathe: ['speed', 'phase'],
      diagonal_runs: ['speed', 'wavelength', 'phase', 'sigma'],
      perimeter_chase: ['speed', 'wavelength', 'phase'],
      bouncing_jumps: ['speed', 'angle', 'wavelength', 'steps', 'phase'],
      galaxy_stars: ['speed'],
      spiral_vortex: ['speed', 'wavelength', 'center_x', 'center_y', 'arms', 'phase'],
      crossfire_waves: ['speed', 'wavelength', 'phase'],
      center_burst: ['speed', 'wavelength', 'center_x', 'center_y', 'sigma', 'phase']
    };

    var GRID_MODES = ['grid', 'brick'];
    var DEFAULT_UPDATE_INTERVAL = 1.5;
    var DEFAULT_TRANSITION = 1.4;
    var DEFAULT_FRAMES = 8;
    var DEFAULT_MIN_COLOR_DELTA = 5;
    var DEFAULT_MIN_BRIGHTNESS_DELTA = 4;

    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function wrap01(v) { return v - Math.floor(v); }
    function sin01(c) { return 0.5 + 0.5 * Math.sin(TAU * c); }
    function roundHalfUp(v) { return Math.floor(v + 0.5); }

    function srgbChannelToLinear(c) {
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    }

    function linearChannelToSrgb(c) {
      return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    }

    function parseColor(value, fallback) {
      var def = fallback === undefined ? [255, 255, 255] : fallback;
      if (value && typeof value === 'object' && !Array.isArray(value)) {
        value = value.color || value.hex;
      }
      if (typeof value === 'string') {
        var text = value.trim().replace('#', '');
        if (text.length === 3) text = text[0] + text[0] + text[1] + text[1] + text[2] + text[2];
        if (text.length === 6) {
          var r = parseInt(text.slice(0, 2), 16);
          var g = parseInt(text.slice(2, 4), 16);
          var b = parseInt(text.slice(4, 6), 16);
          if (!isNaN(r) && !isNaN(g) && !isNaN(b) && /^[0-9a-f]+$/i.test(text)) return [r, g, b];
        }
        return def;
      }
      if (Array.isArray(value) && value.length >= 3) {
        var out = [];
        for (var i = 0; i < 3; i++) {
          var n = Math.round(Number(value[i]));
          if (isNaN(n)) return def;
          out.push(clamp(n, 0, 255));
        }
        return out;
      }
      return def;
    }

    function normalizePalette(palette) {
      var list = palette;
      if (typeof list === 'string') {
        var preset = PALETTES[list.trim().toLowerCase()];
        list = preset ? preset.colors.slice() : PALETTES[DEFAULT_PALETTE].colors.slice();
      }
      if (!list || !list.length) list = PALETTES[DEFAULT_PALETTE].colors.slice();
      var stops = [];
      for (var i = 0; i < list.length; i++) {
        var parsed = parseColor(list[i], null);
        if (parsed) stops.push(parsed);
      }
      if (!stops.length) {
        var fallback = PALETTES[DEFAULT_PALETTE].colors;
        for (var j = 0; j < fallback.length; j++) stops.push(parseColor(fallback[j]));
      }
      return stops;
    }

    function paletteColor(stops, position) {
      var n = stops.length;
      if (n === 1) return stops[0].slice();
      var pos = position - Math.floor(position);
      var scaled = pos * n;
      var index = Math.floor(scaled) % n;
      var frac = scaled - Math.floor(scaled);
      var c0 = stops[index];
      var c1 = stops[(index + 1) % n];
      var out = [];
      for (var ch = 0; ch < 3; ch++) {
        var a = srgbChannelToLinear(c0[ch] / 255);
        var b = srgbChannelToLinear(c1[ch] / 255);
        var mixed = a + (b - a) * frac;
        out.push(clamp(roundHalfUp(linearChannelToSrgb(mixed) * 255), 0, 255));
      }
      return out;
    }

    function colorHex(rgb) {
      return '#' + rgb.map(function (c) {
        var t = clamp(Math.round(c), 0, 255).toString(16).toUpperCase();
        return t.length < 2 ? '0' + t : t;
      }).join('');
    }

    function hash01(index, salt) {
      var h = (Math.imul(index | 0, 2654435761) + Math.imul(salt | 0, 40503) + 0x9E3779B9) >>> 0;
      h = (h ^ (h >>> 15)) >>> 0;
      h = Math.imul(h, 2246822519) >>> 0;
      h = (h ^ (h >>> 13)) >>> 0;
      h = Math.imul(h, 3266489917) >>> 0;
      h = (h ^ (h >>> 16)) >>> 0;
      return h / 4294967296;
    }

    function resolveParams(params) {
      var resolved = {};
      var key;
      for (key in DEFAULT_PARAMS) resolved[key] = DEFAULT_PARAMS[key];
      if (params) {
        for (key in params) {
          if (!Object.prototype.hasOwnProperty.call(DEFAULT_PARAMS, key)) continue;
          var value = parseFloat(params[key]);
          if (!isNaN(value)) resolved[key] = value;
        }
      }
      for (key in resolved) {
        var spec = PARAM_SPECS[key];
        if (spec) resolved[key] = clamp(resolved[key], spec.min, spec.max);
      }
      if (resolved.brightness_max < resolved.brightness_min) {
        resolved.brightness_max = resolved.brightness_min;
      }
      return resolved;
    }

    function roomBounds(scene) {
      var room = (scene && scene.room) || {};
      var width = parseFloat(room.width);
      var height = parseFloat(room.height);
      if (isNaN(width)) width = 6.0;
      if (isNaN(height)) height = 4.5;
      return [width > 0.01 ? width : 0.01, height > 0.01 ? height : 0.01];
    }

    function resolveLights(scene) {
      var raw = (scene && scene.lights) || [];
      var lights = [];
      for (var i = 0; i < raw.length; i++) {
        var item = raw[i];
        if (!item || typeof item !== 'object') continue;
        var entityId = String(item.entity_id || item.entity || '').trim();
        if (!entityId) continue;
        var x = parseFloat(item.x);
        var y = parseFloat(item.y);
        lights.push({
          entity_id: entityId,
          x: isNaN(x) ? 0 : x,
          y: isNaN(y) ? 0 : y,
          row: parseInt(item.row, 10) || 0,
          col: parseInt(item.col, 10) || 0,
          index: i,
          name: String(item.name || entityId)
        });
      }
      return lights;
    }

    function prepareNodes(scene) {
      var bounds = roomBounds(scene);
      var width = bounds[0], height = bounds[1];
      var scale = Math.max(width, height);
      return resolveLights(scene).map(function (light) {
        return Object.assign({}, light, {
          nx: light.x / width,
          ny: light.y / height,
          xn: (light.x - width / 2) / scale,
          yn: (light.y - height / 2) / scale,
          rw: width,
          rh: height
        });
      });
    }

    function perimeterFraction(x, y, width, height) {
      var perimeter = 2 * (width + height);
      if (perimeter <= 0) return 0;
      var px = clamp(x, 0, width);
      var py = clamp(y, 0, height);
      var candidates = [
        [py, px],
        [width - px, width + py],
        [height - py, width + height + (width - px)],
        [px, 2 * width + height + (height - py)]
      ];
      var bestDistance = candidates[0][0];
      var bestArc = candidates[0][1];
      for (var i = 1; i < candidates.length; i++) {
        if (candidates[i][0] < bestDistance) {
          bestDistance = candidates[i][0];
          bestArc = candidates[i][1];
        }
      }
      return wrap01(bestArc / perimeter);
    }

    function direction(node, params) {
      var angle = (params.angle * Math.PI) / 180;
      return node.nx * Math.cos(angle) + node.ny * Math.sin(angle);
    }

    var EFFECT_FUNCS = {
      linear_wave: function (node, params, t) {
        var u = direction(node, params);
        var v = sin01(u / params.wavelength - params.speed * t + params.phase);
        return [v, v];
      },
      radial_pulse: function (node, params, t) {
        var dx = node.xn - (params.center_x - 0.5);
        var dy = node.yn - (params.center_y - 0.5);
        var r = Math.hypot(dx, dy);
        var v = sin01(r / params.wavelength - params.speed * t + params.phase);
        return [v, v];
      },
      checkerboard_breathe: function (node, params, t) {
        var parity = ((node.row + node.col) % 2 + 2) % 2;
        var offset = parity ? 0.5 : 0;
        var v = wrap01(params.speed * t + offset + params.phase);
        var intensity = sin01(2 * params.speed * t + offset + params.phase);
        return [v, intensity];
      },
      diagonal_runs: function (node, params, t) {
        var u = (node.nx + node.ny) / 2;
        var p = wrap01(u / params.wavelength - params.speed * t + params.phase);
        var d = p - 0.5;
        var v = Math.exp(-(d * d) / (2 * params.sigma * params.sigma));
        return [v, v];
      },
      perimeter_chase: function (node, params, t) {
        var s = perimeterFraction(node.x, node.y, node.rw, node.rh);
        var v = sin01(s / params.wavelength - params.speed * t + params.phase);
        return [v, v];
      },
      bouncing_jumps: function (node, params, t) {
        var u = direction(node, params);

    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = 'rgba(56,189,248,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ccx - 12, ccy); ctx.lineTo(ccx + 12, ccy);
    ctx.moveTo(ccx, ccy - 12); ctx.lineTo(ccx, ccy + 12);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ccx, ccy, 7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    updateHud(frame);
    updateSelectedInfo();
  }

  function updateHud(frame) {
    var el2 = document.getElementById('hud');
    if (!el2) return;
    var entry = frame[state.selected] || frame[0];
    el2.textContent = entry
      ? 't ' + fmt(currentTime(), 2) + 's  \u00b7  ' + entry.entity_id +
        '  rgb(' + entry.rgb.join(',') + ')  ' + entry.brightness_pct + '%'
      : 'no fixtures yet - use Generate grid or Add light';
  }

  function loop(now) {
    requestAnimationFrame(loop);
    draw();
  }

  function pointerToRoom(ev) {
    if (!view) return null;
    var rect = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - rect.left - view.ox) / view.scale,
      y: (ev.clientY - rect.top - view.oy) / view.scale
    };
  }

  function hitTest(point) {
    var threshold = 22 / (view ? view.scale : 1);
    var best = -1;
    var bestDistance = threshold;
    (state.scene.lights || []).forEach(function (light, index) {
      var distance = Math.hypot(light.x - point.x, light.y - point.y);
      if (distance <= bestDistance) { bestDistance = distance; best = index; }
    });
    return best;
  }

  function snapPoint(x, y) {
    var room = state.scene.room || { width: 6, height: 4.5 };
    var grid = state.scene.grid || { rows: 3, cols: 4 };
    if (!state.snap) return { x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100 };
    var stepX = (room.width || 6) / Math.max(1, grid.cols || 1) / 2;
    var stepY = (room.height || 4.5) / Math.max(1, grid.rows || 1) / 2;
    var pad = room.padding === undefined ? 0 : room.padding;
    var sx = pad + Math.round((x - pad) / stepX) * stepX;
    var sy = pad + Math.round((y - pad) / stepY) * stepY;
    return {
      x: Math.round(E.clamp(sx, 0, room.width) * 100) / 100,
      y: Math.round(E.clamp(sy, 0, room.height) * 100) / 100
    };
  }

  canvas.addEventListener('pointerdown', function (ev) {
    var point = pointerToRoom(ev);
    if (!point) return;
    var index = hitTest(point);
    var room = state.scene.room || { width: 6, height: 4.5 };
    if (index >= 0) {
      state.selected = index;
      drag = { index: index };
      try { canvas.setPointerCapture(ev.pointerId); } catch (err) { /* ignore */ }
    } else if (state.addMode) {
      var x = E.clamp(point.x, 0, room.width);
      var y = E.clamp(point.y, 0, room.height);
      var snapped = snapPoint(x, y);
      var nextIndex = state.scene.lights.length;
      state.scene.lights.push({
        entity_id: 'light.' + state.prefix + '_' + (nextIndex + 1),
        name: 'Can ' + (nextIndex + 1),
        x: snapped.x, y: snapped.y, row: 0, col: nextIndex
      });
      state.selected = nextIndex;
      state.addMode = false;
    } else {
      state.selected = null;
    }
    renderPanel();
    renderSummary();
  });

  canvas.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var point = pointerToRoom(ev);
    if (!point) return;
    var light = state.scene.lights[drag.index];
    if (!light) return;
    var room = state.scene.room || { width: 6, height: 4.5 };
    var x = E.clamp(point.x, 0, room.width);
    var y = E.clamp(point.y, 0, room.height);
    if (ev.shiftKey) {
      light.x = Math.round(x * 100) / 100;
      light.y = Math.round(y * 100) / 100;
    } else {
      var snapped = snapPoint(x, y);
      light.x = snapped.x;
      light.y = snapped.y;
    }
    updateSelectedInfo();
  });

  function endDrag(ev) {
    if (drag) { try { canvas.releasePointerCapture(ev.pointerId); } catch (err) { /* ignore */ } }
    drag = null;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  /* ------------------------------------------------------------- summaries */

  function renderSummary() {
    var room = state.scene.room || {};
    var el2 = document.getElementById('sceneSummary');
    if (el2) {
      el2.textContent = fmt(room.width, 2) + ' \u00d7 ' + fmt(room.height, 2) + ' m  \u00b7  ' +
        (state.scene.grid ? state.scene.grid.rows + '\u00d7' + state.scene.grid.cols + ' ' + state.scene.grid.mode : '') +
        '  \u00b7  ' + (state.scene.lights || []).length + ' fixtures  \u00b7  ' +
        E.EFFECT_LABELS[state.effect];
    }
    var chip = document.getElementById('engineChip');
    if (chip) chip.innerHTML = '';
    if (chip) {
      chip.appendChild(h('span', { class: 'dot' }));
      chip.appendChild(h('span', { text: 'engine v' + E.VERSION }));
    }
  }

  function renderTabBar() {
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    [['layout', 'Layout'], ['effects', 'Effects'], ['palette', 'Palette'],
     ['deploy', 'Deploy'], ['files', 'Files']].forEach(function (entry) {
      tabs.appendChild(h('button', {
        class: 'tab' + (state.tab === entry[0] ? ' active' : ''),
        text: entry[1],

      }));
    });
  }

  /* -------------------------------------------------------------- controls */

  function numberField(label, value, step, onInput) {
    var input = h('input', { type: 'number', step: step, value: value, class: 'mono' });
    input.style.width = '90px';
    input.addEventListener('input', function () {
      var v = parseFloat(input.value);
      if (!isNaN(v)) onInput(v);
    });
    return h('div', { class: 'field' }, [h('label', { text: label }), input]);
  }

  function check(label, value, onChange) {
    var input = h('input', { type: 'checkbox' });
    input.checked = !!value;
    input.addEventListener('change', function () { onChange(input.checked); });
    return h('label', { class: 'chk' }, [input, h('span', { text: label })]);
  }

  function textField(label, value, onInput, width) {
    var input = h('input', { type: 'text', value: value, class: 'mono' });

    input.addEventListener('input', function () { onInput(input.value); });
    return h('div', { class: 'field' }, [h('label', { text: label }), input]);
  }

      idInput.style.width = '100%';

      });
      selectPanel.appendChild(h('div', { class: 'row' }, h('div', { class: 'field', style: 'flex:1 1 260px' }, [
        h('label', { text: 'Entity id' }), idInput
      ])));
      var info = h('div', { class: 'row mono', id: 'selectedInfo' });
      selectPanel.appendChild(info);
      selectPanel.appendChild(h('div', { class: 'row' }, [
        h('button', {
          class: 'danger', text: 'Remove',
          onclick: function () {
            state.scene.lights.splice(state.selected, 1);

            renderPanel(); renderSummary();
          }

          text: 'Center',

  function updateSelectedInfo() {
    var info = document.getElementById('selectedInfo');
    if (!info) return;
    var light = state.scene.lights[state.selected];
    if (!light) { info.textContent = ''; return; }
    info.textContent = 'x ' + fmt(light.x, 2) + ' m \u00b7 y ' + fmt(light.y, 2) + ' m \u00b7 row ' + (light.row | 0) + ' \u00b7 col ' + (light.col | 0);
  }

  function panelEffects(host) {
    var grid = h('div', { class: 'grid-effects' });
    E.EFFECTS.forEach(function (effect) {
      grid.appendChild(h('button', {
        class: 'effect' + (state.effect === effect ? ' active' : ''),

      }, [

      ]));

  function paramRow(key, spec) {

    });

    });

    });

    ]);
  }

  function panelPalette(host) {
    var presetsPanel = h('div', { class: 'panel' }, h('h4', { text: 'Presets (' + Object.keys(E.PALETTES).length + ')' }));
    var swatches = h('div', { class: 'swatches' });
    Object.keys(E.PALETTES).forEach(function (key) {
      var preset = E.PALETTES[key];
      var bar = h('div', { class: 'bar' });
      bar.style.background = 'linear-gradient(90deg, ' + preset.colors.join(', ') + ')';
      swatches.appendChild(h('button', {
        class: 'swatch' + (samePalette(state.palette, preset.colors) ? ' active' : ''),
        onclick: function () { state.palette = preset.colors.slice(); renderPanel(); }
      }, [bar, h('span', { text: preset.name })]));
    });
    presetsPanel.appendChild(swatches);
    host.appendChild(presetsPanel);

    var stopsPanel = h('div', { class: 'panel' }, h('h4', { text: 'Custom palette \u00b7 cyclical, interpolated in linear light' }));
    var ramp = h('canvas', { class: 'ramp', height: '26' });
    stopsPanel.appendChild(ramp);
    state.palette.forEach(function (hex, index) {
      var color = h('input', { type: 'color', value: normalizeHex(hex) });
      color.addEventListener('input', function () {
        state.palette[index] = color.value.toUpperCase();
        hexInput.value = color.value.toUpperCase();
        drawRamp(ramp);
      });
      var hexInput = h('input', { type: 'text', class: 'hex mono', value: hex });
      hexInput.addEventListener('change', function () {
        var value = hexInput.value.trim();
        if (/^#?[0-9a-fA-F]{6}$/.test(value)) {
          if (value.charAt(0) !== '#') value = '#' + value;
          state.palette[index] = value.toUpperCase();
          color.value = value;
          renderPanel();
        }
      });
      var stop = h('div', { class: 'stop' }, [
        h('span', { class: 'mono hint', text: String(index + 1).padStart(2, '0') }),
        color,
        hexInput,
        h('button', { class: 'small', text: '\u2191', title: 'Move up', onclick: function () { moveStop(index, index - 1); } }),
        h('button', { class: 'small', text: '\u2193', title: 'Move down', onclick: function () { moveStop(index, index + 1); } }),
        h('button', {
          class: 'small danger', text: 'Delete',
          onclick: function () {
            if (state.palette.length <= 1) { setStatus('A palette needs at least one stop.'); return; }
            state.palette.splice(index, 1);
            renderPanel();
          }
        })
      ]);
      stopsPanel.appendChild(stop);
    });
    stopsPanel.appendChild(h('div', { class: 'row' }, [
      h('button', {
        text: 'Add stop',
        onclick: function () { state.palette.push('#FFFFFF'); renderPanel(); }
      }),
      h('button', {
        text: 'Reverse',
        onclick: function () { state.palette = state.palette.slice().reverse(); renderPanel(); }
      }),
      h('button', {
        text: 'Use custom palette',
        onclick: function () { setStatus('Custom palette is already live - export below.'); }
      })
    ]));
    host.appendChild(stopsPanel);
    drawRamp(ramp);
  }

  function moveStop(from, to) {
    if (to < 0 || to >= state.palette.length) return;
    var copy = state.palette.slice();
    var item = copy.splice(from, 1)[0];
    copy.splice(to, 0, item);
    state.palette = copy;
    renderPanel();
  }

  function samePalette(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {
      if (String(a[i]).toUpperCase() !== String(b[i]).toUpperCase()) return false;
    }
    return true;
  }

  function normalizeHex(hex) {
    var text = String(hex).trim();
    if (text.charAt(0) !== '#') text = '#' + text;
    return /^#[0-9a-fA-F]{6}$/.test(text) ? text : '#FFFFFF';
  }

  function drawRamp(canvasEl) {
    if (!canvasEl) return;
    var width = canvasEl.clientWidth || 320;
    var height = 26;
    var dpr = window.devicePixelRatio || 1;
    canvasEl.width = Math.round(width * dpr);
    canvasEl.height = Math.round(height * dpr);
    canvasEl.style.height = height + 'px';
    var g = canvasEl.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var stops = E.normalizePalette(state.palette);
    for (var x = 0; x < width; x++) {
      var rgb = E.paletteColor(stops, x / width);
      g.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
      g.fillRect(x, 0, 1, height);
    }
  }

  /* ----------------------------------------------------------- operations */

  function applyGrid() {
    var room = state.scene.room || {};
    var layout = E.buildLayout({
      prefix: state.prefix,
      rows: state.gridForm.rows,
      cols: state.gridForm.cols,
      mode: state.gridForm.mode,
      width: room.width || 6,
      height: room.height || 4.5,
      padding: room.padding === undefined ? 0.5 : room.padding,
      name: state.scene.name || 'Ceiling'
    });
    state.scene.lights = layout.lights;
    state.scene.room = layout.room;
    state.scene.grid = layout.grid;
    state.selected = null;
    setStatus('Generated ' + layout.lights.length + ' fixtures (' + state.gridForm.mode + ').');
    renderPanel();
    renderSummary();
  }

  function renumber() {
    var lights = state.scene.lights.slice().sort(function (a, b) {
      return (a.row - b.row) || (a.col - b.col);
    });
    var prefix = String(state.prefix || 'ceiling_can').trim().toLowerCase().replace(/\s+/g, '_') || 'ceiling_can';
    lights.forEach(function (light, index) {

      light.name = 'Can ' + (index + 1);
    });
    state.scene.lights = lights;
    state.selected = null;
    setStatus('Renumbered ' + lights.length + ' fixtures as light.' + prefix + '_1..' + lights.length + '.');
    renderPanel();
    renderSummary();
  }

  function clearLights() {
    state.scene.lights = [];
    state.selected = null;
    setStatus('All fixtures removed.');
    renderPanel();
    renderSummary();
  }

  /* ----------------------------------------------------------------- boot */

  var playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', function () {
    state.playing = !state.playing;
    playBtn.textContent = state.playing ? 'Pause' : 'Play';
  });

  renderTabBar();
  renderPanel();
  renderSummary();
  setStatus('Ready. Nothing leaves this tab - open the Files tab to install the integration.');
  requestAnimationFrame(loop);
})();

<script type="text/plain" data-csg-file="custom_components/ceiling_scene_generator/__init__.py" data-csg-size="13198">"""The Ceiling Scene Generator integration.

Turns an array of recessed ceiling lights into an orchestrated spatial canvas:
room + fixture layout, ten mathematical effects, a palette, a rate limited async
task runner, HA Storage persistence and a static scripts.yaml compiler.
"""

from __future__ import annotations

import logging
from pathlib import Path
from typing import Any

from homeassistant.config_entries import ConfigEntry
from homeassistant.const import EVENT_HOMEASSISTANT_STOP, Platform
from homeassistant.core import HomeAssistant, ServiceCall, SupportsResponse
from homeassistant.exceptions import HomeAssistantError

from .const import (
    CARD_FILENAME,
    CARD_URL,
    CONF_AUTO_RESUME,
    CONF_TRANSITION,
    CONF_UPDATE_INTERVAL,
    DEFAULT_PALETTE,
    DEFAULT_TRANSITION,
    DEFAULT_UPDATE_INTERVAL,
    DOMAIN,
    EFFECTS,
    NAME,
    SERVICE_DELETE_SCENE,
    SERVICE_LIST_SCENES,
    SERVICE_SAVE_AS_SCRIPT,
    SERVICE_SAVE_SCENE,
    SERVICE_START,
    SERVICE_STOP,
    WWW_DIRNAME,
)
from .runner import SceneConfig, SceneRunner
from .schemas import (
    DELETE_SCENE_SCHEMA,
    LIST_SCENES_SCHEMA,
    SAVE_AS_SCRIPT_SCHEMA,
    SAVE_SCENE_SCHEMA,
    START_SCHEMA,
    STOP_SCHEMA,
)
from .script_compiler import (
    compile_card_yaml,
    compile_script,
    compile_service_call,
    palette_hex_list,
)
from .storage import SceneStore

_LOGGER = logging.getLogger(__name__)

PLATFORMS: list[Platform] = [Platform.SWITCH]


# --------------------------------------------------------------------------- #
# Setup / teardown
# --------------------------------------------------------------------------- #

async def async_setup(hass: HomeAssistant, config: dict[str, Any]) -> bool:
    """Integration is configured through the UI only."""
    return True


async def async_setup_entry(hass: HomeAssistant, entry: ConfigEntry) -> bool:
    """Set up Ceiling Scene Generator from a config entry."""
    store = SceneStore(hass)
    await store.async_load()
    runner = SceneRunner(hass)
    hass.data.setdefault(DOMAIN, {})[entry.entry_id] = {"store": store, "runner": runner}

    await hass.config_entries.async_forward_entry_setups(entry, PLATFORMS)
    await _async_register_frontend(hass)
    _async_register_services(hass)

    entry.async_on_unload(
        hass.bus.async_listen_once(EVENT_HOMEASSISTANT_STOP, _async_handle_stop_event(hass))
    )

    if entry.options.get(CONF_AUTO_RESUME, False):
        try:
            if await runner.async_resume_last(store):
                _LOGGER.info("Ceiling Scene Generator auto-resumed the last scene")
        except Exception as err:  # never block startup on a bad stored scene
            _LOGGER.warning("Could not auto-resume the last ceiling scene: %s", err)

    return True


async def async_unload_entry(hass: HomeAssistant, entry: ConfigEntry) -> bool:
    """Unload a config entry."""
    unloaded = await hass.config_entries.async_unload_platforms(entry, PLATFORMS)
    if not unloaded:
        return False
    data = hass.data.get(DOMAIN, {}).pop(entry.entry_id, None)
    if data:
        await data["runner"].async_stop()
    if not hass.data.get(DOMAIN):
        _async_remove_services(hass)
    return True


def _async_handle_stop_event(hass: HomeAssistant):
    async def _handle(event) -> None:
        data = _data(hass)
        if data:
            await data["runner"].async_stop()

    return _handle


# --------------------------------------------------------------------------- #
# Frontend (Lovelace card)
# --------------------------------------------------------------------------- #

async def _async_register_frontend(hass: HomeAssistant) -> None:
    """Serve and register ``www/ceiling-scene-card.js``."""
    card_path = Path(__file__).parent / WWW_DIRNAME / CARD_FILENAME
    if not card_path.is_file():
        _LOGGER.warning("Ceiling Scene Generator card not found at %s", card_path)
        return

    try:
        from homeassistant.components.http import StaticPathConfig

        await hass.http.async_register_static_paths(
            [StaticPathConfig(CARD_URL, str(card_path), False)]
        )
    except ImportError:  # pragma: no cover - very old core
        hass.http.register_static_path(CARD_URL, str(card_path), False)
    except (RuntimeError, ValueError) as err:
        _LOGGER.debug("Static path %s already registered: %s", CARD_URL, err)

    try:
        from homeassistant.components.frontend import add_extra_js_url

        add_extra_js_url(hass, CARD_URL)
        _LOGGER.debug("Registered Lovelace resource %s", CARD_URL)
    except Exception as err:  # pragma: no cover - frontend may be unavailable
        _LOGGER.warning(
            "Could not auto-register the Lovelace resource, add it manually as %s (%s)",
            CARD_URL,
            err,
        )


# --------------------------------------------------------------------------- #
# Services
# --------------------------------------------------------------------------- #

def _data(hass: HomeAssistant) -> dict[str, Any] | None:
    """Return the store/runner bundle of the (single) configured entry."""
    for entry_data in hass.data.get(DOMAIN, {}).values():
        if isinstance(entry_data, dict) and "runner" in entry_data:
            return entry_data
    return None


def _resolve_scene(payload: dict[str, Any], saved: dict[str, Any] | None) -> dict[str, Any]:
    scene = payload.get("scene") or (saved or {}).get("scene")
    if not scene or not scene.get("lights"):
        raise HomeAssistantError(
            "Ceiling Scene Generator: no scene given. Pass `scene:` with your lights, "
            "or `name:` of a scene saved with ceiling_scene_generator.save_scene."
        )
    return dict(scene)


def _build_config(payload: dict[str, Any], saved: dict[str, Any] | None, scene: dict[str, Any]) -> SceneConfig:
    def pick(key: str, default: Any) -> Any:
        for source in (payload, saved or {}, scene):
            value = source.get(key) if isinstance(source, dict) else None
            if value not in (None, "", []):
                return value
        return default

    return SceneConfig.from_dict(
        {
            "name": pick("name", scene.get("name") or "Ceiling"),
            "scene": scene,
            "effect": pick("effect", EFFECTS[0]),
            "params": pick("params", {}),
            "palette": pick("palette", DEFAULT_PALETTE),
            "update_interval": pick("update_interval", DEFAULT_UPDATE_INTERVAL),
            "transition": pick("transition", DEFAULT_TRANSITION),
            "min_color_delta": payload.get("min_color_delta"),
            "min_brightness_delta": payload.get("min_brightness_delta"),
            "restore_on_stop": payload.get("restore_on_stop", False),
        }
    )


def _async_register_services(hass: HomeAssistant) -> None:
    if hass.services.has_service(DOMAIN, SERVICE_START):
        return

    async def handle_start(call: ServiceCall) -> dict[str, Any]:
        data = _data(hass)
        if data is None:
            raise HomeAssistantError("Ceiling Scene Generator is not configured yet")
        payload = dict(call.data)
        saved = data["store"].get(payload.get("name") or "")
        scene = _resolve_scene(payload, saved)
        config = _build_config(payload, saved, scene)
        if payload.get("save"):
            await data["store"].async_save_scene(config.name, config.as_dict())
        await data["runner"].async_start(config)
        return data["runner"].snapshot()

    async def handle_stop(call: ServiceCall) -> dict[str, Any]:
        data = _data(hass)
        if data is None:
            raise HomeAssistantError("Ceiling Scene Generator is not configured yet")
        await data["runner"].async_stop(bool(call.data.get("restore_state", False)))
        if call.data.get("clear_last_run"):
            await data["store"].async_clear_last_run()
        return data["runner"].snapshot()

    async def handle_save_as_script(call: ServiceCall) -> dict[str, Any]:
        data = _data(hass)
        if data is None:
            raise HomeAssistantError("Ceiling Scene Generator is not configured yet")
        payload = dict(call.data)
        saved = data["store"].get(payload.get("name") or "")
        scene = _resolve_scene(payload, saved)
        config = _build_config(payload, saved, scene)
        frames = int(payload.get("frames") or 8)
        transition = payload.get("transition")
        result = compile_script(
            scene=scene,
            effect=config.effect,
            params=config.params,
            palette=config.palette,
            frames=frames,
            script_name=payload.get("script_name"),
            alias=payload.get("alias"),
            transition=transition,
        )
        result["service_call_yaml"] = compile_service_call(
            scene=scene,
            effect=config.effect,
            params=config.params,
            palette=config.palette,
            update_interval=config.update_interval,
            transition=config.transition,
        )
        result["card_yaml"] = compile_card_yaml(
            scene=scene, effect=config.effect, palette=config.palette, title=f"Ceiling Scene - {config.name}"
        )
        result["palette"] = palette_hex_list(config.palette)
        result["effect"] = config.effect
        if payload.get("write_file"):
            filename = payload.get("filename") or f"{result['script_id']}.yaml"
            path = Path(hass.config.path("ceiling_scenes")) / filename
            await hass.async_add_executor_job(_write_script, path, result["yaml"])
            result["path"] = str(path)
        return result

    async def handle_save_scene(call: ServiceCall) -> dict[str, Any]:
        data = _data(hass)
        if data is None:
            raise HomeAssistantError("Ceiling Scene Generator is not configured yet")
        payload = dict(call.data)
        name = str(payload["name"]).strip() or "Ceiling"
        saved = data["store"].get(name)
        scene = payload.get("scene") or (saved or {}).get("scene")
        if not scene or not scene.get("lights"):
            raise HomeAssistantError(
                "Ceiling Scene Generator: a scene needs at least one light; pass `scene:` to save a layout."
            )
        config = _build_config({"name": name}, saved, dict(scene))
        record = config.as_dict()
        key = await data["store"].async_save_scene(name, record)
        return {"name": key, "saved": True, "count": len(data["store"].scenes)}

    async def handle_delete_scene(call: ServiceCall) -> dict[str, Any]:
        data = _data(hass)
        if data is None:
            raise HomeAssistantError("Ceiling Scene Generator is not configured yet")
        name = str(call.data["name"])
        deleted = await data["store"].async_delete_scene(name)
        return {"name": name, "deleted": deleted, "count": len(data["store"].scenes)}

    async def handle_list_scenes(call: ServiceCall) -> dict[str, Any]:
        data = _data(hass)
        if data is None:
            raise HomeAssistantError("Ceiling Scene Generator is not configured yet")
        scenes = data["store"].scenes
        return {
            "scenes": scenes,
            "count": len(scenes),
            "running": data["runner"].snapshot(),
            "effects": list(EFFECTS),
        }

    hass.services.async_register(
        DOMAIN, SERVICE_START, handle_start, schema=START_SCHEMA,
        supports_response=SupportsResponse.OPTIONAL,
    )
    hass.services.async_register(DOMAIN, SERVICE_STOP, handle_stop, schema=STOP_SCHEMA)
    hass.services.async_register(
        DOMAIN, SERVICE_SAVE_AS_SCRIPT, handle_save_as_script, schema=SAVE_AS_SCRIPT_SCHEMA,
        supports_response=SupportsResponse.OPTIONAL,
    )
    hass.services.async_register(
        DOMAIN, SERVICE_SAVE_SCENE, handle_save_scene, schema=SAVE_SCENE_SCHEMA,
        supports_response=SupportsResponse.OPTIONAL,
    )
    hass.services.async_register(
        DOMAIN, SERVICE_DELETE_SCENE, handle_delete_scene, schema=DELETE_SCENE_SCHEMA,
        supports_response=SupportsResponse.OPTIONAL,
    )
    hass.services.async_register(
        DOMAIN, SERVICE_LIST_SCENES, handle_list_scenes, schema=LIST_SCENES_SCHEMA,
        supports_response=SupportsResponse.ONLY,
    )


def _async_remove_services(hass: HomeAssistant) -> None:
    for service in (
        SERVICE_START,
        SERVICE_STOP,
        SERVICE_SAVE_AS_SCRIPT,
        SERVICE_SAVE_SCENE,
        SERVICE_DELETE_SCENE,
        SERVICE_LIST_SCENES,
    ):
        if hass.services.has_service(DOMAIN, service):
            hass.services.async_remove(DOMAIN, service)


def _write_script(path: Path, content: str) -> None:
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_text(content, encoding="utf-8")


def _default_options() -> dict[str, Any]:
    return {
        CONF_UPDATE_INTERVAL: DEFAULT_UPDATE_INTERVAL,
        CONF_TRANSITION: DEFAULT_TRANSITION,
        CONF_AUTO_RESUME: False,
    }


__all__ = [
    "DOMAIN",
    "NAME",
    "PLATFORMS",
    "async_setup",
    "async_setup_entry",
    "async_unload_entry",
    "_default_options",
]
</script>

from __future__ import annotations

from typing import Any

import voluptuous as vol
from homeassistant.config_entries import ConfigEntry, ConfigFlow, OptionsFlow
from homeassistant.core import callback
from homeassistant.data_entry_flow import FlowResult

from .const import (
    CONF_AUTO_RESUME,
    CONF_TRANSITION,
    CONF_UPDATE_INTERVAL,
    DEFAULT_AUTO_RESUME,
    DEFAULT_TRANSITION,
    DEFAULT_UPDATE_INTERVAL,
    DOMAIN,
    NAME,
)


def _options_schema(current: dict[str, Any] | None = None) -> vol.Schema:
    current = current or {}
    return vol.Schema(
        {
            vol.Optional(
                CONF_UPDATE_INTERVAL,
                default=current.get(CONF_UPDATE_INTERVAL, DEFAULT_UPDATE_INTERVAL),
            ): vol.All(vol.Coerce(float), vol.Range(min=0.2, max=60)),
            vol.Optional(
                CONF_TRANSITION,
                default=current.get(CONF_TRANSITION, DEFAULT_TRANSITION),
            ): vol.All(vol.Coerce(float), vol.Range(min=0, max=60)),
            vol.Optional(
                CONF_AUTO_RESUME,
                default=current.get(CONF_AUTO_RESUME, DEFAULT_AUTO_RESUME),
            ): bool,
        }
    )


class CeilingSceneGeneratorConfigFlow(ConfigFlow, domain=DOMAIN):
    """Handle the (single instance) configuration."""

    VERSION = 1

    async def async_step_user(self, user_input: dict[str, Any] | None = None) -> FlowResult:
        if self._async_current_entries():
            return self.async_abort(reason="single_instance_allowed")
        if user_input is not None:
            return self.async_create_entry(
                title=NAME,
                data={},
                options={**user_input},
            )
        return self.async_show_form(step_id="user", data_schema=_options_schema())

    @staticmethod
    @callback
    def async_get_options_flow(config_entry: ConfigEntry) -> OptionsFlow:
        return CeilingSceneGeneratorOptionsFlow()


class CeilingSceneGeneratorOptionsFlow(OptionsFlow):
    """Edit the default timing and start-up behaviour."""

    def __init__(self, config_entry: ConfigEntry | None = None) -> None:
        # Recent cores inject `config_entry` for us; older ones expect it here.
        if config_entry is not None:
            self.config_entry = config_entry

    def _entry(self) -> ConfigEntry | None:
        entry = getattr(self, "config_entry", None)
        if entry is not None:
            return entry
        entries = getattr(self.hass.config_entries, "async_entries", None)
        if callable(entries):
            found = entries(DOMAIN)
            if found:
                return found[0]
        return None

    async def async_step_init(self, user_input: dict[str, Any] | None = None) -> FlowResult:
        entry = self._entry()
        current = dict(entry.options) if entry is not None else {}
        if user_input is not None:
            return self.async_create_entry(title="", data={**user_input})
        return self.async_show_form(step_id="init", data_schema=_options_schema(current))

<script type="text/plain" data-csg-file="custom_components/ceiling_scene_generator/engine.py" data-csg-size="26758">"""Ceiling Scene Generator - pure, dependency-free effect engine.

This module is the mathematical heart of the integration. It is deliberately
free of any Home Assistant import so that it can be unit tested (and reasoned
about) in isolation, and it is mirrored 1:1 by the JavaScript engine embedded in
``www/ceiling-scene-card.js`` (``globalThis.CeilingSceneEngine``).  A parity test
(``tests/test_js_parity.py``) executes both engines over identical fixtures and
fails if they ever disagree, which is what makes the Lovelace preview an honest
preview of what the physical lights will do.

Coordinate model
----------------
Two coordinate systems are used, on purpose:

``nx, ny``  (0..1, room relative)
    ``nx = x / room_width``, ``ny = y / room_height``.  Used by the directional
    effects (linear / diagonal / crossfire), so that an ``angle`` of 45 deg is
    45 deg on the floorplan regardless of the room's aspect ratio.

``xn, yn``  (-0.5..0.5, isotropic)
    ``xn = (x - room_width / 2) / s`` with ``s = max(room_width, room_height)``,
    same for ``yn``.  Metric distances and polar angles are computed here so that
    radial rings stay circular (a square room yields a circle, a 6x4 m room does
    not stretch its pulse into an ellipse).

Every effect returns a ``(value, intensity)`` pair in the 0..1 range:

``value``
    Position inside the palette (cyclically wrapped), i.e. the *colour*.
``intensity``
    Luminance envelope, mapped onto ``brightness_min..brightness_max`` and scaled
    by the ``amplitude`` parameter, i.e. the *brightness*.
"""

from __future__ import annotations

import math
import re
from typing import Any, Iterable, Mapping, Sequence

# --------------------------------------------------------------------------- #
# Constants
# --------------------------------------------------------------------------- #

VERSION = "1.0.0"

TAU = math.pi * 2.0

EFFECTS: tuple[str, ...] = (
    "linear_wave",
    "radial_pulse",
    "checkerboard_breathe",
    "diagonal_runs",
    "perimeter_chase",
    "bouncing_jumps",
    "galaxy_stars",
    "spiral_vortex",
    "crossfire_waves",
    "center_burst",
)

EFFECT_LABELS: dict[str, str] = {
    "linear_wave": "Linear Wave",
    "radial_pulse": "Radial Pulse",
    "checkerboard_breathe": "Checkerboard Breathe",
    "diagonal_runs": "Diagonal Runs",
    "perimeter_chase": "Perimeter Chase",
    "bouncing_jumps": "Bouncing Jumps",
    "galaxy_stars": "Galaxy Stars",
    "spiral_vortex": "Spiral Vortex",
    "crossfire_waves": "Crossfire Waves",
    "center_burst": "Center Burst",
}

# The exact equations, shown in the UI and in the generated script header.
EFFECT_EQUATIONS: dict[str, str] = {
    "linear_wave": "u = nx*cos(a) + ny*sin(a);  v = 0.5 + 0.5*sin(2pi*(u/lam - s*t))",
    "radial_pulse": "r = hypot(xn-cx, yn-cy);  v = 0.5 + 0.5*sin(2pi*(r/lam - s*t))",
    "checkerboard_breathe": "c = (row+col) mod 2;  v = frac(s*t + c/2);  i = 0.5+0.5*sin(2pi*(2*s*t + c/2))",
    "diagonal_runs": "u = (nx+ny)/2;  p = frac(u/lam - s*t);  v = exp(-(p-0.5)^2 / (2*sigma^2))",
    "perimeter_chase": "S = arc length of projection onto room boundary;  v = 0.5 + 0.5*sin(2pi*(S/lam - s*t))",
    "bouncing_jumps": "p = frac(u/lam + s*t);  tri = 1-|2p-1|;  v = floor(tri*steps)/(steps-1)",
    "galaxy_stars": "h = hash01(index);  v = frac(h1 + 0.1*s*t);  i = h3 + (0.5+0.5*sin(2pi*(s*rate*t + h2)))^3 * (1-h3)",
    "spiral_vortex": "ang = atan2(yn-cy, xn-cx)/2pi;  v = 0.5 + 0.5*sin(2pi*(ang*arms - r/lam + s*t))",
    "crossfire_waves": "wx = 0.5+0.5*sin(2pi*(nx/lam - s*t));  wy = 0.5+0.5*sin(2pi*(ny/lam + s*t));  v = (wx+wy)/2",
    "center_burst": "r0 = frac(s*t)*0.75;  v = exp(-(r-r0)^2 / (2*sigma^2))",
}

PALETTES: dict[str, dict[str, Any]] = {
    "sunset": {"name": "Sunset", "colors": ["#FF6B35", "#F7931E", "#FDC830", "#D62828", "#6A0572"]},
    "ocean": {"name": "Ocean", "colors": ["#012E4A", "#036280", "#378BA4", "#81BECE", "#E2F1E7"]},
    "cyberpunk": {"name": "Cyberpunk", "colors": ["#FF2A6D", "#05D9E8", "#01012B", "#D1F7FF", "#7700FF"]},
    "rainbow": {"name": "Rainbow", "colors": ["#FF0000", "#FFA500", "#FFFF00", "#00C853", "#0091EA", "#6A1B9A"]},
    "forest": {"name": "Forest", "colors": ["#0B3D0B", "#1E7A34", "#62A744", "#C7E59C", "#2F5D3A"]},
    "aurora": {"name": "Aurora", "colors": ["#00C2A8", "#3BD4AE", "#7B61FF", "#1B1464", "#00E5FF"]},
    "ember": {"name": "Ember", "colors": ["#1A0000", "#5C1010", "#C1292E", "#FF7A18", "#FFD166"]},
    "ice": {"name": "Ice", "colors": ["#061B33", "#0E4C92", "#3FA9F5", "#A8E6FF", "#FFFFFF"]},
}

DEFAULT_PALETTE = "sunset"

DEFAULT_PARAMS: dict[str, float] = {
    "speed": 0.12,       # cycles per second
    "angle": 0.0,        # degrees, direction of the directional effects
    "wavelength": 0.35,  # fraction of the room's long axis per cycle
    "center_x": 0.5,     # pulse / spiral / burst centre, room relative
    "center_y": 0.5,
    "brightness_min": 15.0,
    "brightness_max": 100.0,
    "amplitude": 1.0,    # luminance swing around the mid point (0..1)
    "arms": 3.0,         # spiral arms
    "steps": 6.0,        # quantisation steps of `bouncing_jumps`
    "sigma": 0.18,       # band width of `diagonal_runs` / `center_burst`
    "phase": 0.0,        # global phase offset in cycles
}

# Ranges + UI metadata. The Lovelace card and the web studio are generated from
# this table, so a new parameter only has to be declared once.
PARAM_SPECS: dict[str, dict[str, Any]] = {
    "speed": {"min": 0.01, "max": 1.0, "step": 0.01, "label": "Speed", "unit": "cyc/s", "group": "motion"},
    "angle": {"min": 0.0, "max": 360.0, "step": 1.0, "label": "Angle", "unit": "deg", "group": "motion"},
    "wavelength": {"min": 0.05, "max": 1.5, "step": 0.01, "label": "Wavelength", "unit": "room", "group": "motion"},
    "phase": {"min": 0.0, "max": 1.0, "step": 0.01, "label": "Phase", "unit": "cyc", "group": "motion"},
    "center_x": {"min": 0.0, "max": 1.0, "step": 0.01, "label": "Pulse Center X", "unit": "", "group": "geometry"},
    "center_y": {"min": 0.0, "max": 1.0, "step": 0.01, "label": "Pulse Center Y", "unit": "", "group": "geometry"},
    "arms": {"min": 1.0, "max": 8.0, "step": 1.0, "label": "Spiral Arms", "unit": "", "group": "geometry"},
    "sigma": {"min": 0.02, "max": 0.5, "step": 0.01, "label": "Band Width", "unit": "", "group": "geometry"},
    "steps": {"min": 2.0, "max": 12.0, "step": 1.0, "label": "Jump Steps", "unit": "", "group": "geometry"},
    "brightness_min": {"min": 1.0, "max": 100.0, "step": 1.0, "label": "Brightness Floor", "unit": "%", "group": "light"},
    "brightness_max": {"min": 1.0, "max": 100.0, "step": 1.0, "label": "Brightness Ceiling", "unit": "%", "group": "light"},
    "amplitude": {"min": 0.0, "max": 1.0, "step": 0.05, "label": "Brightness Amplitude", "unit": "", "group": "light"},
}

# Which parameters actually drive each effect (used to disable irrelevant sliders).
EFFECT_PARAMS: dict[str, tuple[str, ...]] = {
    "linear_wave": ("speed", "angle", "wavelength", "phase"),
    "radial_pulse": ("speed", "wavelength", "center_x", "center_y", "phase"),
    "checkerboard_breathe": ("speed", "phase"),
    "diagonal_runs": ("speed", "wavelength", "phase", "sigma"),
    "perimeter_chase": ("speed", "wavelength", "phase"),
    "bouncing_jumps": ("speed", "angle", "wavelength", "steps", "phase"),
    "galaxy_stars": ("speed",),
    "spiral_vortex": ("speed", "wavelength", "center_x", "center_y", "arms", "phase"),
    "crossfire_waves": ("speed", "wavelength", "phase"),
    "center_burst": ("speed", "wavelength", "center_x", "center_y", "sigma", "phase"),
}

# Rate limiting / Wi-Fi friendliness.
DEFAULT_UPDATE_INTERVAL = 1.5   # seconds between service calls
DEFAULT_TRANSITION = 1.4        # hardware fade, ~= update interval
DEFAULT_FRAMES = 8              # frames per cycle baked into an exported script
DEFAULT_MIN_COLOR_DELTA = 5     # sRGB steps before a light is re-sent
DEFAULT_MIN_BRIGHTNESS_DELTA = 4

GRID_MODES = ("grid", "brick")


# --------------------------------------------------------------------------- #
# Colour helpers (sRGB <-> linear light, gamma 2.4 piecewise)
# --------------------------------------------------------------------------- #

def _srgb_channel_to_linear(c: float) -> float:
    """sRGB 0..1 -> linear light 0..1."""
    if c <= 0.04045:
        return c / 12.92
    return ((c + 0.055) / 1.055) ** 2.4


def _linear_channel_to_srgb(c: float) -> float:
    """Linear light 0..1 -> sRGB 0..1."""
    if c <= 0.0031308:
        return c * 12.92
    return 1.055 * (c ** (1.0 / 2.4)) - 0.055


def parse_color(value: Any, default: tuple[int, int, int] = (255, 255, 255)) -> tuple[int, int, int]:
    """Accept ``#rgb``/``#rrggbb``, ``[r, g, b]`` or ``{color: ...}``."""
    if isinstance(value, Mapping):
        value = value.get("color", value.get("hex"))
    if isinstance(value, str):
        text = value.strip().lstrip("#")
        if len(text) == 3:
            text = "".join(ch * 2 for ch in text)
        if len(text) == 6 and re.fullmatch(r"[0-9a-fA-F]+", text):
            return (int(text[0:2], 16), int(text[2:4], 16), int(text[4:6], 16))
        return default
    if isinstance(value, Sequence) and not isinstance(value, (str, bytes)) and len(value) >= 3:
        try:
            return (
                max(0, min(255, int(round(float(value[0]))))),
                max(0, min(255, int(round(float(value[1]))))),
                max(0, min(255, int(round(float(value[2]))))),
            )
        except (TypeError, ValueError):
            return default
    return default


def normalize_palette(palette: Any) -> list[tuple[int, int, int]]:
    """Normalise any palette-ish input into a list of >=1 RGB tuples.

    A string is treated as a palette *id* ("sunset").  Unparseable stops are
    dropped; when nothing survives, the default palette is used, so an effect is
    always renderable.
    """
    if isinstance(palette, str):
        entry = PALETTES.get(palette.strip().lower())
        palette = entry["colors"] if entry else PALETTES[DEFAULT_PALETTE]["colors"]
    if not isinstance(palette, (list, tuple)) or not palette:
        palette = PALETTES[DEFAULT_PALETTE]["colors"]
    stops = [color for color in (parse_color(item, None) for item in palette) if color is not None]
    if not stops:
        stops = [parse_color(color, None) for color in PALETTES[DEFAULT_PALETTE]["colors"]]
        stops = [color for color in stops if color is not None]
    return stops


def palette_color(palette: Sequence[tuple[int, int, int]], position: float) -> tuple[int, int, int]:
    """Cyclically wrapped interpolation between palette stops in linear light."""
    stops = palette
    n = len(stops)
    if n == 1:
        return stops[0]
    pos = position - math.floor(position)          # wrap into [0, 1)
    scaled = pos * n
    index = int(math.floor(scaled)) % n
    frac = scaled - math.floor(scaled)
    c0 = stops[index]
    c1 = stops[(index + 1) % n]
    out = []
    for channel in range(3):
        a = _srgb_channel_to_linear(c0[channel] / 255.0)
        b = _srgb_channel_to_linear(c1[channel] / 255.0)
        mixed = a + (b - a) * frac
        out.append(max(0, min(255, round_half_up(_linear_channel_to_srgb(mixed) * 255.0))))
    return (out[0], out[1], out[2])


def color_hex(rgb: Sequence[int]) -> str:
    return "#%02X%02X%02X" % (rgb[0], rgb[1], rgb[2])


def wrap01(value: float) -> float:
    return value - math.floor(value)


def sin01(cycles: float) -> float:
    """sin() mapped to 0..1 with `cycles` measured in whole periods."""
    return 0.5 + 0.5 * math.sin(TAU * cycles)


def hash01(index: int, salt: int = 0) -> float:
    """Deterministic 32-bit integer hash -> 0..1 (bit-identical in Python/JS)."""
    h = (int(index) * 2654435761 + int(salt) * 40503 + 0x9E3779B9) & 0xFFFFFFFF
    h ^= h >> 15
    h = (h * 2246822519) & 0xFFFFFFFF
    h ^= h >> 13
    h = (h * 3266489917) & 0xFFFFFFFF
    h ^= h >> 16
    return h / 4294967296.0


# --------------------------------------------------------------------------- #
# Parameters / geometry
# --------------------------------------------------------------------------- #

def clamp(value: float, low: float, high: float) -> float:
    return low if value < low else (high if value > high else value)


def round_half_up(value: float) -> int:
    """Round half away from -inf, exactly like JavaScript's ``Math.round``.

    Python's built-in ``round`` is banker's rounding, which would make the Python
    engine and the JS preview disagree by one unit on exact .5 values.
    """
    return int(math.floor(value + 0.5))


def resolve_params(params: Mapping[str, Any] | None) -> dict[str, float]:
    """Merge user params over the defaults, coerced to float and range-clamped."""
    resolved = dict(DEFAULT_PARAMS)
    if params:
        for key, value in params.items():
            if key not in DEFAULT_PARAMS:
                continue
            try:
                resolved[key] = float(value)
            except (TypeError, ValueError):
                continue
    for key, value in resolved.items():
        spec = PARAM_SPECS.get(key)
        if spec:
            resolved[key] = clamp(value, float(spec["min"]), float(spec["max"]))
    if resolved["brightness_max"] < resolved["brightness_min"]:
        resolved["brightness_max"] = resolved["brightness_min"]
    return resolved


def room_bounds(scene: Mapping[str, Any] | None) -> tuple[float, float]:
    room = (scene or {}).get("room") or {}
    try:
        width = float(room.get("width", 6.0))
    except (TypeError, ValueError):
        width = 6.0
    try:
        height = float(room.get("height", 4.5))
    except (TypeError, ValueError):
        height = 4.5
    width = width if width > 0.01 else 0.01
    height = height if height > 0.01 else 0.01
    return width, height


def resolve_lights(scene: Mapping[str, Any] | None) -> list[dict[str, Any]]:
    """Pull the light list out of a scene, tolerating partial entries."""
    raw = (scene or {}).get("lights") or []
    lights: list[dict[str, Any]] = []
    for index, item in enumerate(raw):
        if not isinstance(item, Mapping):
            continue
        entity_id = str(item.get("entity_id") or item.get("entity") or "").strip()
        if not entity_id:
            continue
        try:
            x = float(item.get("x", 0.0))
            y = float(item.get("y", 0.0))
        except (TypeError, ValueError):
            x, y = 0.0, 0.0
        try:
            row = int(item.get("row", 0))
        except (TypeError, ValueError):
            row = 0
        try:
            col = int(item.get("col", 0))
        except (TypeError, ValueError):
            col = 0
        lights.append(
            {
                "entity_id": entity_id,
                "x": x,
                "y": y,
                "row": row,
                "col": col,
                "index": index,
                "name": str(item.get("name") or entity_id),
            }
        )
    return lights


def prepare_nodes(scene: Mapping[str, Any] | None) -> list[dict[str, Any]]:
    """Attach the normalised coordinate systems used by the effects."""
    width, height = room_bounds(scene)
    scale = max(width, height)
    nodes: list[dict[str, Any]] = []
    for light in resolve_lights(scene):
        nodes.append(
            {
                **light,
                "nx": light["x"] / width,
                "ny": light["y"] / height,
                "xn": (light["x"] - width / 2.0) / scale,
                "yn": (light["y"] - height / 2.0) / scale,
                "rw": width,
                "rh": height,
            }
        )
    return nodes


def perimeter_fraction(x: float, y: float, width: float, height: float) -> float:
    """Normalised arc length (0..1) of the projection onto the room perimeter.

    The walk starts at the (0, 0) corner and runs clockwise in screen space:
    bottom edge -> right edge -> top edge -> left edge.
    """
    perimeter = 2.0 * (width + height)
    if perimeter <= 0:
        return 0.0
    px = clamp(x, 0.0, width)
    py = clamp(y, 0.0, height)
    candidates = (
        (py, px),                        # y = 0 edge, left -> right
        (width - px, width + py),        # x = width edge, top -> bottom
        (height - py, width + height + (width - px)),   # y = height edge, right -> left
        (px, 2.0 * width + height + (height - py)),     # x = 0 edge, bottom -> top
    )
    best_distance, best_arc = candidates[0]
    for distance, arc in candidates[1:]:
        if distance < best_distance:
            best_distance, best_arc = distance, arc
    return (best_arc % perimeter) / perimeter


# --------------------------------------------------------------------------- #
# The ten effects.  Each returns (value, intensity) in 0..1 for one node.
# --------------------------------------------------------------------------- #

def _direction(node: Mapping[str, Any], params: Mapping[str, float]) -> float:
    """Projection of a node onto the wave direction (room relative, 0..1 scale)."""
    angle = math.radians(params["angle"])
    return node["nx"] * math.cos(angle) + node["ny"] * math.sin(angle)


def effect_linear_wave(node, params, t):
    u = _direction(node, params)
    v = sin01(u / params["wavelength"] - params["speed"] * t + params["phase"])
    return v, v


def effect_radial_pulse(node, params, t):
    dx = node["xn"] - (params["center_x"] - 0.5)
    dy = node["yn"] - (params["center_y"] - 0.5)
    r = math.hypot(dx, dy)
    v = sin01(r / params["wavelength"] - params["speed"] * t + params["phase"])
    return v, v


def effect_checkerboard_breathe(node, params, t):
    parity = (node["row"] + node["col"]) % 2
    v = wrap01(params["speed"] * t + (0.5 if parity else 0.0) + params["phase"])
    intensity = sin01(2.0 * params["speed"] * t + (0.5 if parity else 0.0) + params["phase"])
    return v, intensity


def effect_diagonal_runs(node, params, t):
    u = (node["nx"] + node["ny"]) / 2.0
    p = wrap01(u / params["wavelength"] - params["speed"] * t + params["phase"])
    d = p - 0.5
    v = math.exp(-(d * d) / (2.0 * params["sigma"] * params["sigma"]))
    return v, v


def effect_perimeter_chase(node, params, t):
    s = perimeter_fraction(node["x"], node["y"], node["rw"], node["rh"])
    v = sin01(s / params["wavelength"] - params["speed"] * t + params["phase"])
    return v, v


def effect_bouncing_jumps(node, params, t):
    u = _direction(node, params)
    p = wrap01(u / params["wavelength"] + params["speed"] * t + params["phase"])
    tri = 1.0 - abs(2.0 * p - 1.0)
    steps = max(2.0, params["steps"])
    v = math.floor(tri * steps) / (steps - 1.0)
    v = clamp(v, 0.0, 1.0)
    return v, 0.35 + 0.65 * v


def effect_galaxy_stars(node, params, t):
    index = node["index"]
    h1 = hash01(index, 1)
    h2 = hash01(index, 7)
    h3 = hash01(index, 13)
    rate = 0.5 + 1.5 * hash01(index, 21)
    twinkle = sin01(params["speed"] * rate * t + h2)
    twinkle = twinkle * twinkle * twinkle
    v = wrap01(h1 + 0.1 * params["speed"] * t + params["phase"])
    intensity = 0.15 + 0.25 * h3 + twinkle * (0.85 - 0.25 * h3)
    return v, clamp(intensity, 0.0, 1.0)


def effect_spiral_vortex(node, params, t):
    dx = node["xn"] - (params["center_x"] - 0.5)
    dy = node["yn"] - (params["center_y"] - 0.5)
    radius = math.hypot(dx, dy)
    angle = math.atan2(dy, dx) / TAU
    v = sin01(angle * params["arms"] - radius / params["wavelength"] + params["speed"] * t + params["phase"])
    return v, v


def effect_crossfire_waves(node, params, t):
    wave_x = sin01(node["nx"] / params["wavelength"] - params["speed"] * t + params["phase"])
    wave_y = sin01(node["ny"] / params["wavelength"] + params["speed"] * t + params["phase"])
    v = (wave_x + wave_y) / 2.0
    return v, v


def effect_center_burst(node, params, t):
    dx = node["xn"] - (params["center_x"] - 0.5)
    dy = node["yn"] - (params["center_y"] - 0.5)
    r = math.hypot(dx, dy)
    radius = wrap01(params["speed"] * t + params["phase"]) * 0.75
    d = r - radius
    v = math.exp(-(d * d) / (2.0 * params["sigma"] * params["sigma"]))
    return v, 0.25 + 0.75 * v


EFFECT_FUNCS = {
    "linear_wave": effect_linear_wave,
    "radial_pulse": effect_radial_pulse,
    "checkerboard_breathe": effect_checkerboard_breathe,
    "diagonal_runs": effect_diagonal_runs,
    "perimeter_chase": effect_perimeter_chase,
    "bouncing_jumps": effect_bouncing_jumps,
    "galaxy_stars": effect_galaxy_stars,
    "spiral_vortex": effect_spiral_vortex,
    "crossfire_waves": effect_crossfire_waves,
    "center_burst": effect_center_burst,
}


# --------------------------------------------------------------------------- #
# Frame computation
# --------------------------------------------------------------------------- #

def compute_frame(
    scene: Mapping[str, Any] | None,
    effect: str = "linear_wave",
    params: Mapping[str, Any] | None = None,
    palette: Any = None,
    t: float = 0.0,
) -> list[dict[str, Any]]:
    """Full frame for one instant in time.

    Returns one entry per light: ``entity_id``, ``rgb`` (0..255 ints),
    ``brightness_pct``, plus the raw ``value``/``intensity`` used by the canvas
    preview (rounded to 6 decimals so Python and JS stay comparable).
    """
    resolved = resolve_params(params)
    stops = normalize_palette(palette)
    func = EFFECT_FUNCS.get(effect) or EFFECT_FUNCS["linear_wave"]
    frame: list[dict[str, Any]] = []
    for node in prepare_nodes(scene):
        value, intensity = func(node, resolved, float(t))
        value = clamp(value, 0.0, 1.0)
        intensity = clamp(intensity, 0.0, 1.0)
        rgb = palette_color(stops, value)
        mixed = clamp(0.5 + resolved["amplitude"] * (intensity - 0.5), 0.0, 1.0)
        brightness = resolved["brightness_min"] + (
            resolved["brightness_max"] - resolved["brightness_min"]
        ) * mixed
        frame.append(
            {
                "entity_id": node["entity_id"],
                "rgb": [rgb[0], rgb[1], rgb[2]],
                "brightness_pct": round_half_up(clamp(brightness, 1.0, 100.0)),
                "value": round(value, 6),
                "intensity": round(intensity, 6),
                "row": node["row"],
                "col": node["col"],
            }
        )
    return frame


def cycle_period(params: Mapping[str, Any] | None) -> float:
    """Seconds for one full cycle of the effect."""
    speed = resolve_params(params)["speed"]
    if speed <= 0:
        return 60.0
    return 1.0 / speed


# --------------------------------------------------------------------------- #
# Rate limiting (keeps the Wi-Fi quiet while the visible motion stays smooth)
# --------------------------------------------------------------------------- #

def frame_deltas(
    previous: Mapping[str, Mapping[str, Any]],
    frame: Iterable[Mapping[str, Any]],
    min_color_delta: int = DEFAULT_MIN_COLOR_DELTA,
    min_brightness_delta: int = DEFAULT_MIN_BRIGHTNESS_DELTA,
) -> list[dict[str, Any]]:
    """Subset of `frame` that differs enough from `previous` to be worth sending."""
    changed: list[dict[str, Any]] = []
    for entry in frame:
        old = previous.get(entry["entity_id"])
        if old is None:
            changed.append(dict(entry))
            continue
        color_delta = max(abs(entry["rgb"][i] - old["rgb"][i]) for i in range(3))
        brightness_delta = abs(entry["brightness_pct"] - old["brightness_pct"])
        if color_delta >= min_color_delta or brightness_delta >= min_brightness_delta:
            changed.append(dict(entry))
    return changed


def index_frame(frame: Iterable[Mapping[str, Any]]) -> dict[str, dict[str, Any]]:
    return {entry["entity_id"]: dict(entry) for entry in frame}


def service_payload(entry: Mapping[str, Any], transition: float | None = None) -> dict[str, Any]:
    """`light.turn_on` data for one engine entry."""
    payload: dict[str, Any] = {
        "rgb_color": list(entry["rgb"]),
        "brightness_pct": int(entry["brightness_pct"]),
    }
    if transition is not None:
        payload["transition"] = round(float(transition), 2)
    return payload


# --------------------------------------------------------------------------- #
# Layout builder (shared by the integration services, the card and the studio)
# --------------------------------------------------------------------------- #

def build_layout(
    prefix: str = "ceiling_can",
    rows: int = 3,
    cols: int = 4,
    mode: str = "grid",
    width: float = 6.0,
    height: float = 4.5,
    padding: float = 0.5,
    name: str = "Ceiling",
    domain: str = "light",
    sequential_cols: bool = False,
) -> dict[str, Any]:
    """Generate a rows x cols ceiling layout (grid or brick/staggered rows).

    Entity ids are ``<domain>.<prefix>_<n>`` numbered row-major from 1.  A brick
    row is offset by half a cell; the trailing light is dropped when it would
    leave the usable area, so rows can hold ``cols`` or ``cols - 1`` lights.
    """
    rows = max(1, int(rows))
    cols = max(1, int(cols))
    width = float(width) if float(width) > 0.01 else 0.01
    height = float(height) if float(height) > 0.01 else 0.01
    pad = clamp(float(padding), 0.0, min(width, height) / 2.0 - 0.01 if min(width, height) > 0.02 else 0.0)
    usable_w = max(0.01, width - 2 * pad)
    usable_h = max(0.01, height - 2 * pad)
    cell_w = usable_w / cols
    cell_h = usable_h / rows
    prefix = re.sub(r"[^a-z0-9_]+", "_", (prefix or "ceiling_can").strip().lower()).strip("_") or "ceiling_can"
    domain = re.sub(r"[^a-z0-9_]+", "_", (domain or "light").strip().lower()).strip("_") or "light"
    mode = mode if mode in GRID_MODES else "grid"

    lights: list[dict[str, Any]] = []
    counter = 1
    for row in range(rows):
        offset = cell_w / 2.0 if (mode == "brick" and row % 2 == 1) else 0.0
        col = 0
        while col < cols:
            x = pad + (col + 0.5) * cell_w + offset
            y = pad + (row + 0.5) * cell_h
            if x > width - pad + 1e-9:
                break
            lights.append(
                {
                    "entity_id": f"{domain}.{prefix}_{counter}",
                    "name": f"Can {counter}",
                    "x": round(x, 4),
                    "y": round(y, 4),
                    "row": row,
                    "col": counter - 1 if sequential_cols else col,
                }
            )
            counter += 1
            col += 1
    return {
        "name": name,
        "room": {"width": round(width, 4), "height": round(height, 4), "padding": round(pad, 4)},
        "grid": {"mode": mode, "rows": rows, "cols": cols},
        "lights": lights,
    }
